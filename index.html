<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>График ассистентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: верхняя полоса с разделами; «Расписание» = широкая доска кресла×даты + колонка ассистентов справа */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --sunk:#E7EDED; --line:#D2DCDC; --ink:#122A2C; --muted:#587173;
  --accent:#0D6D69; --accent-ink:#FFFFFF; --accent-soft:#D4EBE9;
  --am:#B8740F; --am-soft:#FBEBD0; --pm:#4F4FC9; --pm-soft:#E5E5FA; --day:#0D6D69; --day-soft:#D4EBE9;
  --ok:#24804F; --ok-soft:#DAF0E2; --warn:#9C6512; --warn-soft:#FAEED3; --bad:#BC3A33; --bad-soft:#F8DEDC;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1718; --surface:#152223; --sunk:#1B2B2C; --line:#2A3E3F; --ink:#E2EDED; --muted:#92A9AA;
  --accent:#3DB2AA; --accent-ink:#03201E; --accent-soft:#133A38;
  --am:#EDB45E; --am-soft:#3A2B12; --pm:#A0A0F6; --pm-soft:#25254B; --day:#3DB2AA; --day-soft:#133A38;
  --ok:#5CC48A; --ok-soft:#15321F; --warn:#E3AA4C; --warn-soft:#382A11; --bad:#F27D74; --bad-soft:#3D1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#152223; --sunk:#1B2B2C; --line:#2A3E3F; --ink:#E2EDED; --muted:#92A9AA;
  --accent:#3DB2AA; --accent-ink:#03201E; --accent-soft:#133A38;
  --am:#EDB45E; --am-soft:#3A2B12; --pm:#A0A0F6; --pm-soft:#25254B; --day:#3DB2AA; --day-soft:#133A38;
  --ok:#5CC48A; --ok-soft:#15321F; --warn:#E3AA4C; --warn-soft:#382A11; --bad:#F27D74; --bad-soft:#3D1A18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.store{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.store.on b{background:var(--ok)} .store.warn b{background:var(--warn)}

main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:500;font-size:14px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 9px;font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select{color:var(--ink);font-weight:400;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}

/* shift chips */
.sh{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:700}
.sh.day{background:var(--day-soft);color:var(--day)} .sh.am{background:var(--am-soft);color:var(--am)} .sh.pm{background:var(--pm-soft);color:var(--pm)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--sunk);font-size:12px;border:1px solid transparent;white-space:nowrap}
.tag.miss{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.pick-tags .tag{cursor:pointer;padding:4px 10px;border:1px solid var(--line);background:var(--surface)}
.pick-tags .tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pick-tags .tag.neg[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}

/* banner */
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.note.info{border-left-color:var(--accent)}

/* schedule layout */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.period{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.status b{color:var(--ink)} .status .bad b{color:var(--bad)}
.sched{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:1000px){.sched{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}
.boardwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
table.board{border-collapse:separate;border-spacing:0;font-size:13px}
.board th,.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
.board thead th{position:sticky;top:0;background:var(--surface);padding:8px 8px;text-align:left;font-weight:600;white-space:nowrap;z-index:2}
.board thead th .d{font-size:15px}
.board thead th.we{color:var(--bad)} .board thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.board .lab{position:sticky;left:0;background:var(--surface);z-index:1;padding:8px 10px;font-weight:600;white-space:nowrap;color:var(--muted);font-size:12px;min-width:74px}
.board thead .lab{z-index:3}
.board tr.cl td{background:var(--sunk);padding:6px 10px;font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.02em;position:sticky;left:0}
.board td.c{width:168px;min-width:168px;padding:5px;background:var(--surface)}
.board td.c.we{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.ent{border-radius:8px;padding:6px 7px;display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px solid var(--line)}
.ent+.ent{margin-top:5px}
.ent .h{display:flex;gap:6px;align-items:center}
.ent .doc{border:0;background:none;padding:0;font-weight:600;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .doc:hover{color:var(--accent)}
.ent .tags .tag{font-size:11px;padding:1px 6px}
.as{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;text-align:left;font-size:12.5px;display:flex;align-items:center;gap:6px;width:100%}
.as.empty{border-style:dashed;color:var(--muted)}
.as.empty.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:600}
.as.warn{border-color:var(--warn)}
.as .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.as.warn .dot{background:var(--warn)}
.addent{border:1px dashed var(--line);background:transparent;border-radius:7px;width:100%;padding:3px;color:var(--muted);font-size:12px;margin-top:5px;opacity:.7}
.addent:hover{opacity:1;color:var(--accent);border-color:var(--accent)}
.empty-board{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty-board h2{color:var(--ink)}

/* rail */
.board .cost{font-size:11px;color:var(--muted);flex:none}
.board.vert thead tr:first-child th{top:0} .board.vert thead tr:nth-child(2) th{top:37px}
.board.vert .clh{font-family:var(--font-display);font-weight:500;font-size:12px;background:var(--sunk);letter-spacing:.02em}
.board.vert .chh{font-size:12px;color:var(--muted)}
.board.vert .first{border-left:2px solid var(--line)}
.board.vert .dl{text-align:left;color:var(--ink)}
.board.vert .dl .d{font-size:15px}
.board.vert tr.we .dl{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.board.vert .wer{color:var(--bad);font-size:13px}
.board.vert tr.today .dl{box-shadow:inset 3px 0 0 var(--accent)}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:76px}
@media (max-width:1000px){.rail{position:static}}
.rail summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.rail summary::-webkit-details-marker{display:none}
.rail summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.rail[open] summary .chev{transform:rotate(90deg)}
.rail .list{border-top:1px solid var(--line);max-height:65vh;overflow:auto}
.ra{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
.ra:hover{background:var(--bg)}
.ra .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.ra .meta .z{color:var(--warn);font-weight:600}
.rail .foot{padding:10px 14px;font-size:12px;color:var(--muted)}

/* template grid */
.tpl{border-collapse:separate;border-spacing:0}
.tpl th,.tpl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.tpl thead th{padding:8px;font-weight:600;text-align:left;background:var(--surface)}
.tpl td.c{width:150px;min-width:150px;padding:5px;vertical-align:top}
.tcell{width:100%;min-height:58px;border:1px dashed var(--line);border-radius:8px;background:transparent;display:flex;flex-direction:column;gap:4px;padding:6px;text-align:left}
.tcell:hover{border-color:var(--accent)}
.tcell .e{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px;min-width:0}
.tcell .e span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell .plus{color:var(--muted);font-size:12px;margin:auto}

/* cards list */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.card .k{font-size:12px;color:var(--muted)}
.card .k b{color:var(--ink);font-weight:500}
.ex{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar input{flex:1;min-width:180px}

/* modal */
.mback{position:fixed;inset:0;background:rgb(10 20 22/.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 50px rgb(0 0 0/.25);display:flex;flex-direction:column}
.modal.wide{width:min(720px,100%)}
.mh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 10px}
.mh .ttl{flex:1;min-width:0}
.mb{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:8px;font-size:16px;flex:none}
.grp h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:6px;align-items:center}
.grp h3 .n{background:var(--sunk);border-radius:999px;padding:0 7px;font-weight:700}
.grp.prio h3{color:var(--accent)} .grp.can h3{color:var(--ok)} .grp.never h3{color:var(--bad)}
.cand{display:flex;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left}
.cand+.cand{margin-top:5px}
.cand:hover{border-color:var(--accent)}
.cand .nm{font-weight:600}
.cand .why{font-size:12px;color:var(--muted)}
.cand .r{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);flex:none}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.grp.no .cand,.grp.never .cand{opacity:.72}
.list-empty{font-size:13px;color:var(--muted);padding:2px 0}

/* calendar */
.brush{display:flex;gap:6px;flex-wrap:wrap}
.brush button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.brush button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:2px 0;border:0;background:none;border-radius:6px}
.cal button.wh:hover{background:var(--sunk);color:var(--ink)}
.cal .dd{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cal .dd.out{visibility:hidden}
.cal .dd.day{background:var(--day-soft);border-color:var(--day)} .cal .dd.am{background:var(--am-soft);border-color:var(--am)} .cal .dd.pm{background:var(--pm-soft);border-color:var(--pm)}
.cal .dd small{font-size:10px;font-weight:700}
.cal .dd.day small{color:var(--day)} .cal .dd.am small{color:var(--am)} .cal .dd.pm small{color:var(--pm)}
.cal .dd.inp{outline:2px solid var(--ink);outline-offset:-1px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-family:var(--font-display);font-weight:500;font-size:14px;min-width:140px;text-align:center}

.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
.opt input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.opt.dis{opacity:.5;cursor:default}
.sh3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.preview{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.busy{opacity:.6;pointer-events:none}
/* бумажный вид для экспорта — всегда светлый, как в привычном вордовском графике */
.xp{width:1123px;padding:26px 30px 22px;background:#FFFFFF;color:#000000;font-family:"PT Serif","Times New Roman",Times,serif;font-size:13px;line-height:1.25}
.xp+.xp{border-top:2px dashed #BBBBBB}
.xtop{font-weight:700;font-size:13px;margin-bottom:8px}
.xg{width:100%;border-collapse:collapse;table-layout:fixed}
.xg th,.xg td{border:1px solid #000000;padding:2px 5px;vertical-align:top;overflow:hidden}
.xg th{font-weight:700;font-style:italic;text-align:center;padding:5px}
.xg .xband td{background:#DCE6F1;height:8px;padding:0}
.xg td.xday{font-style:italic} .xg td.xday b{font-weight:700}
.xg td.xday.we b{color:#000000}
.xg td.xcl{background:#D9D9D9;font-weight:700;font-style:italic}
.xch{font-size:14px}
.xsub{display:block;font-style:italic;font-size:12px;color:#444444}
.xsub.xn{color:#C00000}
.xfoot{text-align:right;font-weight:700;font-style:italic;margin-top:6px}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{padding:0!important;background:#FFFFFF!important}
  body>*:not(#printArea){display:none!important}
  body::before{display:none}
  #printArea{display:block}
  #printArea .xp{width:auto;padding:0;page-break-after:always;break-after:page}
  #printArea .xp:last-child{page-break-after:auto;break-after:auto}
  #printArea .xp+.xp{border-top:0}
  .xg .xband td,.xg td.xcl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.login{max-width:360px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.loginf{display:flex;flex-direction:column;gap:12px}
.lgerr{color:var(--bad);margin:0;font-size:13px;font-weight:600}
.mylist{display:flex;flex-direction:column;gap:10px}
.myday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mydate{display:flex;gap:10px;align-items:baseline;padding:9px 14px;background:var(--sunk)}
.mydate b{font-size:16px} .mydate span{color:var(--muted);font-size:13px} .mydate.we span{color:var(--bad)}
.myshift{display:flex;gap:10px;align-items:flex-start;padding:10px 14px}
.myshift+.myshift{border-top:1px solid var(--line)}
.myt{font-size:14px} .mym{color:var(--muted);font-size:13px;margin-top:2px}
.mywarn{color:var(--warn);font-size:12.5px;font-weight:600;margin-top:3px}
.mycal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;max-width:520px}
.urow{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.urow+.urow{margin-top:6px}
.uh{display:flex;flex-direction:column}
.urow select{max-width:100%}
.orgname{font-weight:600;color:var(--muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgname select{font-weight:600;padding:5px 8px;max-width:220px}
.pw{position:relative;display:block}
.pw input{width:100%;padding-right:42px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);width:34px;height:30px;border-radius:6px;display:grid;place-items:center}
.eye.on{color:var(--accent)} .eye:hover{background:var(--sunk)}
.loginf input[type=text],.loginf .pw input{width:100%}
#invLink{width:100%;font-size:13px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:34px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.bell .badge{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#FFFFFF;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.cand.bwarn{border-left:3px solid var(--warn)}
.warnlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.warnlist li::marker{color:var(--warn)}
.okline{color:var(--ok);font-weight:600}

.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:13px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0/.25)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ---------- подключение к базе (заполняется для версии на GitHub) ---------- */
const SUPA={url:'https://buynizqyabifntjqxgrx.supabase.co',key:'sb_publishable_4aDI96xiZIxwtN2D0JvRgw_gaFpmvOw'};
const SUPA_ON=!!(SUPA.url&&SUPA.key);
const LOGIN_DOMAIN='mregorik.github.io'; // логин «ivanova» хранится в базе как ivanova@mregorik.github.io
const LOGIN_RE=/^[a-z0-9][a-z0-9._-]{2,29}$/;
const loginToEmail=l=>{l=l.trim().toLowerCase();return l.includes('@')?l:l+'@'+LOGIN_DOMAIN};
const emailToLogin=e=>String(e||'').endsWith('@'+LOGIN_DOMAIN)?String(e).split('@')[0]:String(e||'');
/* ---------- utils ---------- */
const STANDALONE=!(window.claude&&window.claude.use);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const SH={day:{s:'Д',l:'Весь день'},am:{s:'У',l:'Утро'},pm:{s:'В',l:'Вечер'}};
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const wdOf=s=>(pd(s).getDay()+6)%7;
const ymOf=s=>s.slice(0,7);
const fmt=s=>{const d=pd(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const fmtL=s=>WD[wdOf(s)].toLowerCase()+' '+fmt(s);
function range(a,b){const o=[];if(!a||!b||a>b)return o;let c=a;for(let i=0;i<190&&c<=b;i++){o.push(c);c=addDays(c,1)}return o}
const shChip=s=>`<span class="sh ${s}" title="${SH[s]?.l||''}">${SH[s]?.s||'?'}</span>`;
const TODAY=iso(new Date());

/* ---------- state ---------- */
const S={cfg:{tags:[],doctors:[],assistants:[],clinics:[]},avail:{},months:{}};
function loadUI(){try{const u=JSON.parse(localStorage.getItem('asst-ui')||'null');if(u)return u}catch(e){}return null}
let UI=Object.assign({orient:'h',tab:'sched',mode:'board',from:TODAY,to:addDays(TODAY,13),clinic:null,railOpen:window.innerWidth>1000},loadUI()||{});
const MISS=new Map(); // entryId -> reason, после автозаполнения
function saveUI(){try{localStorage.setItem('asst-ui',JSON.stringify(UI))}catch(e){}}

const tagById=id=>S.cfg.tags.find(t=>t.id===id);
const docById=id=>S.cfg.doctors.find(d=>d.id===id);
const asById=id=>S.cfg.assistants.find(a=>a.id===id);
const clById=id=>S.cfg.clinics.find(c=>c.id===id);
const docName=id=>docById(id)?.name||'—';
const byName=(a,b)=>a.name.localeCompare(b.name,'ru');

/* ---------- storage ---------- */
const LKEY='asst-data-v1';
const Store={
  mode:'local',db:null,dirty:new Set(),ver:{},timers:{},chains:{},readonly:false,
  mark(path){
    if(this.readonly){toast('Нет прав на изменение этих данных');return}
    this.dirty.add(path);this.ver[path]=(this.ver[path]||0)+1;
    clearTimeout(this.timers[path]);this.timers[path]=setTimeout(()=>this.flush(path),450);
  },
  body(path){
    if(path==='cfg/main')return this.mode==='supa'?splitCfg().pub:clone(S.cfg);
    if(path==='cfg/private')return splitCfg().priv;
    const[col,id]=path.split('/');
    if(col==='avail')return S.avail[id]?{dates:clone(S.avail[id])}:null;
    if(col==='months')return S.months[id]&&Object.keys(S.months[id]).length?{days:clone(S.months[id])}:null;
  },
  flush(path){
    const v=this.ver[path];
    if(this.mode==='supa'){
      const body=this.body(path);const prev=this.chains[path]||Promise.resolve();
      this.chains[path]=prev.then(async()=>{
        if(!ORG&&!LEGACY)return;
        const r=body?await SB.from('docs').upsert({path:P(path),data:body,updated_at:new Date().toISOString()}):await SB.from('docs').delete().eq('path',P(path));
        if(r.error){toast(/row-level|permission/i.test(r.error.message)?'Нет прав на изменение':'Не удалось сохранить. Проверьте интернет');console.warn(r.error)}
      }).finally(()=>{if(this.ver[path]===v)this.dirty.delete(path)});
      return;
    }
    if(this.mode!=='db'){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}this.dirty.delete(path);return}
    const body=this.body(path);
    const prev=this.chains[path]||Promise.resolve();
    this.chains[path]=prev.then(async()=>{
      const ref=this.db.doc(path);
      for(let i=0;i<2;i++){try{body?await ref.set(body):await ref.delete();break}
        catch(e){if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,600+Math.random()*600));continue}writeErr(e);break}}
    }).finally(()=>{if(this.ver[path]===v)this.dirty.delete(path)});
  }
};
function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){Store.readonly=true;toast('Изменения не сохраняются: у вас доступ только для просмотра')}
  else if(c==='quota_exceeded')toast('Хранилище заполнено — удалите старые месяцы расписания');
  else toast('Не удалось сохранить изменение. Проверьте связь');
}
const markCfg=()=>{if(!isAdmin())return;Store.mark('cfg/main');if(Store.mode==='supa')Store.mark('cfg/private')};
// служебное (ставки, телефоны, заметки, приоритеты и «не ставить») хранится отдельно и видно только администратору
const PRIV_D=['prio','block'],PRIV_A=['rate','rateHalf','phone','note'];
let PRIV={doctors:{},assistants:{}};
function splitCfg(){const pub=clone(S.cfg),priv={doctors:{},assistants:{}};
  pub.doctors.forEach(d=>{priv.doctors[d.id]={};PRIV_D.forEach(k=>{if(d[k]!==undefined)priv.doctors[d.id][k]=d[k];delete d[k]})});
  pub.assistants.forEach(a=>{priv.assistants[a.id]={};PRIV_A.forEach(k=>{if(a[k]!==undefined)priv.assistants[a.id][k]=a[k];delete a[k]})});
  return{pub,priv}}
function mergePriv(){S.cfg.doctors.forEach(d=>Object.assign(d,(PRIV.doctors||{})[d.id]||{}));S.cfg.assistants.forEach(a=>Object.assign(a,(PRIV.assistants||{})[a.id]||{}))}
const ROLE=()=>SUPA_ON?(ME&&ME.role)||'none':'admin';
const isAdmin=()=>['admin','owner'].includes(ROLE());
const isOwner=()=>ROLE()==='owner';
const ACT_LATE=[];let PEOPLE_T=null;let ORG=null,ORGS=[],LEGACY=false; // LEGACY — база ещё без организаций (до выполнения SQL)
const orgName=id=>(ORGS.find(o=>o.id===id)||{}).name||'';
const P=p=>LEGACY?p:ORG+':'+p; // путь в базе с префиксом организации
const myCard=()=>ME&&ME.card_id||null;
const markMonth=ym=>{if(!isAdmin())return;Store.mark('months/'+ym)};
const markAvail=id=>{if(!isAdmin()&&!(ROLE()==='assistant'&&id===myCard()))return;Store.mark('avail/'+id)};

function normalize(){
  const c=S.cfg;['tags','doctors','assistants','clinics'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});
  c.doctors.forEach(d=>{d.tags=d.tags||[];d.prio=d.prio||[];d.block=d.block||[]});
  c.assistants.forEach(a=>{a.tags=a.tags||[]});
  c.clinics.forEach(k=>{k.chairs=Math.max(1,k.chairs|0||1);k.template=k.template||{}});
  c.settings=Object.assign({rates:false,cheap:false,showTags:true,useTimes:true},c.settings||{});c.settings.times=Object.assign({am:'9-14',pm:'15-21',day:'9-21'},c.settings.times||{});
}
const SET=()=>S.cfg.settings||{rates:false,cheap:false,showTags:true};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.').replace(/\s/g,''));return isFinite(n)&&n>=0?n:null};
function shiftCost(a,shift){if(!a)return 0;const d=num(a.rate),h=num(a.rateHalf);if(shift==='day')return d??0;return h??(d!=null?d/2:0)}
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
function costMap(){const m={};range(UI.from,UI.to).forEach(d=>forEntries(d,en=>{if(en.assistantId){const a=asById(en.assistantId);m[en.assistantId]=(m[en.assistantId]||0)+shiftCost(a,en.shift)}}));return m}
function setStore(cls,text){const el=$('#store');el.className='store '+cls;el.lastElementChild.textContent=text}

let LIVE=false,SB=null,AUTHED=false,LOGIN_ERR='',LOGIN_BUSY=false,LOGIN_OK='',AUTH_TAB='in',ME=null,MYID=null,PENDING=false;
const SB_LIBS=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'];
function applyDoc(path,data){const[col,id]=path.split('/');
  if(col==='cfg'&&id==='main'){S.cfg=clone(data);mergePriv();normalize()}
  else if(col==='cfg'&&id==='private'){PRIV=clone(data||{});PRIV.doctors=PRIV.doctors||{};PRIV.assistants=PRIV.assistants||{};mergePriv();normalize()}
  else if(col==='avail')S.avail[id]=clone(data.dates||{});
  else if(col==='months')S.months[id]=clone(data.days||{})}
function removeDoc(path){const[col,id]=path.split('/');if(col==='avail')delete S.avail[id];else if(col==='months')delete S.months[id]}
async function initSupa(){
  Store.mode='supa';setStore('','Подключение…');
  let ok=false;for(const src of SB_LIBS){try{await loadLib(src);ok=!!window.supabase;if(ok)break}catch(e){}}
  if(!ok){setStore('warn','Нет связи');LOGIN_ERR='Нет связи с интернетом. Проверьте подключение и обновите страницу.';render();return}
  SB=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}});
  SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){AUTHED=false;PENDING=false;ME=null;setStore('warn','Не выполнен вход');render()}});
  const{data}=await SB.auth.getSession();
  if(INVITE){await loadInvite();
    if(data&&data.session&&INV_STATE==='ok'){INV_HAS_SESSION=true;const ur=await SB.auth.getUser();ME={login:emailToLogin(ur.data?.user?.email)}}
    if(!(data&&data.session)||INV_STATE==='ok'){setStore('warn','Регистрация');render();return}
    INV_STATE=null;dropInviteParam();
  }
  if(!data||!data.session){setStore('warn','Не выполнен вход');render();return}
  await afterLogin();
}
async function afterLogin(){
  setStore('','Загрузка…');
  const ur=await SB.auth.getUser();MYID=ur.data&&ur.data.user?ur.data.user.id:null;
  const mr=await SB.from('members').select('*').eq('user_id',MYID).maybeSingle();
  if(mr.error){console.warn('members',mr.error);ME={role:'admin',login:emailToLogin(ur.data?.user?.email)}} // таблицы участников ещё нет — прежний режим
  else ME=mr.data||{role:'none'};
  const orr=await SB.from('orgs').select('*').order('created_at');LEGACY=!!orr.error;ORGS=orr.error?[]:orr.data;
  if(!['owner','admin','assistant','doctor'].includes(ME.role)||(!LEGACY&&!ME.org_id&&ME.role!=='owner')){AUTHED=false;PENDING=true;setStore('warn','Нет доступа');render();return}
  PENDING=false;
  if(LEGACY){ORG='';await loadOrgData();return}
  ORG=isOwner()&&UI.org&&ORGS.some(o=>o.id===UI.org)?UI.org:(ME.org_id||(ORGS[0]&&ORGS[0].id)||null);
  if(!ORG){AUTHED=true;setStore('warn','Нет организаций');render();return}
  await loadOrgData();
}
async function loadOrgData(){
  setStore('','Загрузка…');
  const pre=LEGACY?'':ORG+':';
  const{data:raw,error}=LEGACY?await SB.from('docs').select('path,data'):await SB.from('docs').select('path,data').like('path',pre+'%');
  const data=(raw||[]).filter(r=>LEGACY?!r.path.includes(':'):true).map(r=>({path:r.path.slice(pre.length),data:r.data}));
  if(error){setStore('warn','Ошибка базы');LOGIN_ERR='Не удалось прочитать базу: '+error.message;AUTHED=false;render();return}
  S.cfg={tags:[],doctors:[],assistants:[],clinics:[]};S.avail={};S.months={};PRIV={doctors:{},assistants:{}};
  const cfgRow=data.find(r=>r.path==='cfg/main');if(cfgRow)applyDoc('cfg/main',cfgRow.data);
  data.forEach(r=>{if(r.path!=='cfg/main')applyDoc(r.path,r.data)});normalize();
  AUTHED=true;LOGIN_ERR='';
  // перенос служебных полей из общего документа в закрытый (один раз)
  if(isAdmin()&&cfgRow&&((cfgRow.data.doctors||[]).some(d=>d.prio||d.block)||(cfgRow.data.assistants||[]).some(a=>PRIV_A.some(k=>a[k]!==undefined))))markCfg();
  if(!isAdmin())UI.rtab=UI.rtab||'mine';
  MISS.clear();loadPeople();
  if(!PEOPLE_T&&isAdmin())PEOPLE_T=setInterval(()=>{if(document.visibilityState==='visible')loadPeople()},60000);
  if(LIVE)return setStore('on',isAdmin()?'Сохраняется в базе':'Подключено'),render();
  LIVE=true;
  SB.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const full=(p.new&&p.new.path)||(p.old&&p.old.path);if(!full)return;
    if(LEGACY?full.includes(':'):!full.startsWith(ORG+':'))return;
    const path=LEGACY?full:full.slice(ORG.length+1);if(Store.dirty.has(path))return;
    if(p.eventType==='DELETE')removeDoc(path);else applyDoc(path,p.new.data);renderSoft();
  }).subscribe();
  setStore('on',isAdmin()?'Сохраняется в базе':'Подключено');render();
}
const pwField=(id,label,ac)=>`<label class="f">${label}<span class="pw"><input type="password" id="${id}" autocomplete="${ac}" required><button type="button" class="eye" data-act="pw-eye" data-v="${id}" aria-label="Показать пароль" title="Показать пароль"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>`;
const INVITE=(()=>{try{return new URLSearchParams(location.search).get('invite')}catch(e){return null}})();
let INV=null,INV_STATE=INVITE?'loading':null,INV_HAS_SESSION=false; // loading | ok | bad
function dropInviteParam(){try{const u=new URL(location.href);u.searchParams.delete('invite');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){}}
async function loadInvite(){
  const r=await SB.rpc('invite_info',{t:INVITE});
  if(r.error||!r.data){INV_STATE='bad';INV=null}else{INV=r.data;INV_STATE='ok'}
}
function viewInvite(){
  if(INV_STATE==='loading'||!SB)return`<div class="login"><h1>Приглашение</h1><p class="sub">Проверяю ссылку…</p></div>`;
  if(INV_STATE==='bad')return`<div class="login"><h1>Ссылка не действует</h1><p class="sub">Приглашение уже использовано или устарело. Попросите у ответственного новую ссылку.</p><div class="row"><button class="btn" data-act="inv-skip">Ко входу</button></div></div>`;
  if(INV_HAS_SESSION)return`<div class="login"><h1>Приглашение</h1><p>Сейчас на этом устройстве выполнен вход как <b>${esc(ME&&ME.login||'')}</b>.</p><p class="sub">Чтобы зарегистрироваться по приглашению, нужно выйти.</p><div class="row"><button class="btn primary" data-act="inv-logout">Выйти и зарегистрироваться</button><button class="btn" data-act="inv-skip">Остаться</button></div></div>`;
  const R={assistant:'ассистент',doctor:'врач',admin:'ответственный за расписание'}[INV.role]||'';
  return`<div class="login"><h1>Регистрация</h1><p class="sub">${esc(INV.org||'')} · ${R}</p>
  <form id="inviteForm" class="loginf">
  <label class="f">Имя и фамилия<input type="text" id="rgName" autocomplete="name" value="${esc(INV.card_name||'')}" required></label>
  <label class="f">Логин — придумайте, латиницей<input type="text" id="lgLogin" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="volkova" required></label>
  ${pwField('lgPass','Пароль — не короче 6 символов','new-password')}
  ${pwField('lgPass2','Повторите пароль','new-password')}
  ${LOGIN_ERR?`<p class="lgerr">${esc(LOGIN_ERR)}</p>`:''}
  <button class="btn primary ${LOGIN_BUSY?'busy':''}">${LOGIN_BUSY?'Подождите…':'Зарегистрироваться'}</button></form>
  <p class="sub">Запомните логин и пароль — по ним вы будете входить в программу.</p></div>`;
}
function viewLogin(){
  if(INV_STATE)return viewInvite();
  return`<div class="login"><h1>Вход</h1><p class="sub">График ассистентов</p>
  <form id="loginForm" class="loginf">
  <label class="f">Логин<input type="text" id="lgLogin" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  ${pwField('lgPass','Пароль','current-password')}
  ${LOGIN_ERR?`<p class="lgerr">${esc(LOGIN_ERR)}</p>`:''}${LOGIN_OK?`<p class="okline" style="margin:0">${esc(LOGIN_OK)}</p>`:''}
  <button class="btn primary ${LOGIN_BUSY?'busy':''}" ${SB?'':'disabled'}>${LOGIN_BUSY?'Подождите…':'Войти'}</button></form>
  <p class="sub">Нет логина? Попросите у ответственного вашей клиники ссылку-приглашение.</p></div>`;
}
function viewPending(){
  const blocked=ME&&ME.role==='blocked';
  return`<div class="login"><h1>${blocked?'Доступ закрыт':'Заявка отправлена'}</h1>
  <p>${ME&&ME.name?esc(ME.name)+', в':'В'}ы вошли как <b>${esc(ME&&ME.login||'')}</b>.</p>
  <p class="sub">${blocked?'Администратор закрыл доступ к программе. Если это ошибка, обратитесь к нему.':ME&&ME.role==='pending'&&!ME.org_id?'Код клиники не найден, поэтому заявку видит только главный администратор. Сообщите ему или ответственному своей клиники.':'Ответственный клиники ещё не открыл доступ. Как только откроет, нажмите «Проверить».'}</p>

}

    normalize();setStore('warn',STANDALONE?'Офлайн · данные на этом компьютере':'Только в этом браузере');render();return;
  }
  Store.mode='db';Store.db=db;setStore('','Подключение…');
  timer=setTimeout(()=>setStore('warn','Нет связи с хранилищем'),10000);
  const ok=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);setStore('on','Сохраняется автоматически')}};
  const fail=e=>{clearTimeout(timer);setStore('warn','Хранилище недоступно')};
  db.doc('cfg/main').onSnapshot(s=>{
    if(!Store.dirty.has('cfg/main')&&s.exists){S.cfg=clone(s.data());normalize();renderSoft()}
    ok(s);
  },fail);
  db.collection('avail').onSnapshot(q=>{
    const next={};q.docs.forEach(d=>{next[d.id]=clone(d.data().dates||{})});
    Object.keys(S.avail).forEach(id=>{if(Store.dirty.has('avail/'+id))next[id]=S.avail[id]});
    S.avail=next;renderSoft();ok(q);
  },fail);
  db.collection('months').onSnapshot(q=>{
    const next={};q.docs.forEach(d=>{next[d.id]=clone(d.data().days||{})});
    Object.keys(S.months).forEach(id=>{if(Store.dirty.has('months/'+id))next[id]=S.months[id]});
    S.months=next;renderSoft();ok(q);
  },fail);
  try{const u=await window.claude.use('user');const w=u&&await u.can('data.write');if(w===false){Store.readonly=true;setStore('warn','Только просмотр')}}catch(e){}
}
let softT;function renderSoft(){clearTimeout(softT);softT=setTimeout(()=>{render();if(M.open)M.refresh()},60)}

/* ---------- schedule data ---------- */
function dayObj(date,create){const ym=ymOf(date);if(!S.months[ym]){if(!create)return null;S.months[ym]={}}const m=S.months[ym];if(!m[date]){if(!create)return null;m[date]={}}return m[date]}
function cellArr(date,cid,ch,create){const d=dayObj(date,create);if(!d)return[];if(!d[cid]){if(!create)return[];d[cid]={}}const c=d[cid];if(!c[ch]){if(!create)return[];c[ch]=[]}return c[ch]}
function forEntries(date,fn){const d=dayObj(date,false);if(!d)return;for(const cl of S.cfg.clinics){const c=d[cl.id];if(!c)continue;for(let ch=0;ch<cl.chairs;ch++){(c[ch]||[]).forEach(en=>fn(en,cl,ch))}}}
function findEntry(date,eid){let r=null;forEntries(date,(en,cl,ch)=>{if(en.id===eid)r={en,cl,ch}});return r}
const overlap=(a,b)=>a==='day'||b==='day'||a===b;
function loadMap(){const m={};range(UI.from,UI.to).forEach(d=>forEntries(d,en=>{if(en.assistantId)m[en.assistantId]=(m[en.assistantId]||0)+1}));return m}
function busyMap(date,exceptId){const m={};forEntries(date,(en,cl)=>{if(en.id===exceptId||!en.assistantId)return;(m[en.assistantId]=m[en.assistantId]||[]).push({shift:en.shift,label:cl.name+', '+docName(en.doctorId)})});return m}
function classify(date,en,busy,load){
  const doc=docById(en.doctorId);const need=en.tags||[];
  return S.cfg.assistants.map(a=>{
    const av=(S.avail[a.id]||{})[date]||null;
    const missing=need.filter(t=>!a.tags.includes(t)&&tagById(t));
    const matched=need.filter(t=>a.tags.includes(t)).length;
    const b=(busy[a.id]||[]).find(x=>overlap(x.shift,en.shift));
    let group,reason='';
    if(doc&&doc.block.includes(a.id)){group='never';reason='не ставить к этому врачу'}
    else if(b){group='no';reason='занят: '+b.label}
    else if(!av){group='no';reason='дата не отмечена'}
    else if(!(av==='day'||av===en.shift)){group='no';reason='может только '+SH[av].l.toLowerCase()}
    else if(doc&&doc.prio.includes(a.id))group='prio';
    else group='can';
    return{a,av,missing,matched,group,reason,load:load[a.id]||0};
  });
}
const sortCands=arr=>arr.sort((x,y)=>x.missing.length-y.missing.length||x.load-y.load||byName(x.a,y.a));
function entryWarn(date,en){
  if(!en.assistantId)return'';const a=asById(en.assistantId);if(!a)return'';
  const c=classify(date,en,busyMap(date,en.id),{}).find(x=>x.a.id===a.id);
  if(!c)return'';if(c.group==='no'||c.group==='never')return c.reason;
  if(c.missing.length)return'нет навыка: '+c.missing.map(t=>tagById(t)?.name).join(', ');return'';
}

  Object.keys(S.months).forEach(ym=>{let ch=false;const m=S.months[ym];Object.values(m).forEach(day=>Object.values(day).forEach(cl=>Object.keys(cl).forEach(k=>{const n=cl[k].filter(e=>!ids.includes(e.doctorId));if(n.length!==cl[k].length){cl[k]=n;ch=true}})));if(ch)markMonth(ym)});

/* ---------- availability ---------- */
let AV={month:null,brush:'day',aid:null,refresh:()=>{}};
function availCal(aid){
  const av=S.avail[aid]||{};const[y,m]=AV.month.split('-').map(Number);
  const first=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();const off=(first.getDay()+6)%7;
  const mine=ROLE()==='assistant';const assigned=new Set();
  if(mine){Object.keys(S.months).forEach(ym=>Object.keys(S.months[ym]).forEach(d=>forEntries(d,en=>{if(en.assistantId===aid)assigned.add(d)})))}
  let cal=WD.map((w,i)=>`<button class="wh" data-act="av-wd" data-v="${i}" title="Отметить все ${w} месяца">${w}</button>`).join('');
  for(let i=0;i<off;i++)cal+=`<span class="dd out"></span>`;
  let cnt=0;
  for(let d=1;d<=days;d++){const ds=iso(new Date(y,m-1,d));const v=av[ds];if(v)cnt++;
    const ring=mine?assigned.has(ds):(ds>=UI.from&&ds<=UI.to);const past=mine&&ds<TODAY;
    cal+=`<button class="dd ${v||''} ${ring?'inp':''}" data-act="av-day" data-v="${ds}" ${past?'disabled style="opacity:.4"':''} aria-label="${ds} ${v?SH[v].l:'нет'}">${d}${v?`<small>${SH[v].s}</small>`:''}</button>`}
  return`<div class="brush">${['day','am','pm'].map(k=>`<button data-act="av-brush" data-v="${k}" aria-pressed="${AV.brush===k}">${shChip(k)} ${SH[k].l}</button>`).join('')}<button data-act="av-brush" data-v="none" aria-pressed="${AV.brush==='none'}">Стереть</button></div>
    <div class="mnav"><button class="btn sm" data-act="av-m" data-v="-1" aria-label="Предыдущий месяц">‹</button><b>${MN[m-1]} ${y}</b><button class="btn sm" data-act="av-m" data-v="1" aria-label="Следующий месяц">›</button><span class="spacer"></span><span class="sub num">${cnt} дн.</span></div>
    <div class="cal">${cal}</div>
    <p class="sub" style="margin:0">Нажмите на день недели в шапке — режим применится ко всем таким дням месяца. ${mine?'Обведены дни, где вы уже стоите в графике: если уберёте такой день, администратор это увидит.':'Обведены дни текущего периода графика.'}</p>`;
}

  const a=asById(aid);if(!a)return;
  AV.month=AV.month||ymOf(UI.from);AV.aid=aid;AV.refresh=()=>M.refresh();
  M.show(()=>({title:`<h2>${esc(a.name)}</h2><p class="sub">Когда может выйти на работу. Выберите режим и нажимайте на дни.</p>`,

function avSet(ds,v){const aid=AV.aid;S.avail[aid]=S.avail[aid]||{};if(v==='none')delete S.avail[aid][ds];else S.avail[aid][ds]=v}
function avMonthDays(){const[y,m]=AV.month.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>iso(new Date(y,m-1,i+1)))}
const avEditable=ds=>isAdmin()||ds>=TODAY;

/* ---------- экраны ассистента и врача ---------- */
function myShifts(field,card){
  const out=[];Object.keys(S.months).sort().forEach(ym=>Object.keys(S.months[ym]).sort().forEach(d=>{if(d<TODAY)return;
    forEntries(d,(en,cl,ch)=>{if(en[field]===card)out.push({d,en,cl,ch})})}));
  return out.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:SHO[x.en.shift]-SHO[y.en.shift]);

function shiftList(items,kind){

    body:(w.length?`<div><h3 style="margin:0 0 6px;font-size:12px;color:var(--warn)">Проверьте перед запуском</h3><ul class="warnlist">${w.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:`<p class="okline">Всё настроено, можно заполнять.</p>`)+
      `<div><label class="chk"><input type="checkbox" id="aOver" ${over?'checked':''}> Перераспределить и уже назначенных ассистентов</label>
      <label class="chk"><input type="checkbox" id="aMiss" ${allowMiss?'checked':''}> Если нет ассистента с нужным навыком — ставить без него (отметится жёлтым)</label></div>
      <p class="sub" style="margin:0">Порядок подбора: приоритетный ассистент врача → совпадение навыков → у кого меньше смен в периоде${SET().rates&&SET().cheap?' → из равных — с меньшей ставкой':''}. Слоты, для которых никого не нашлось, подсветятся красным.</p>`,
    foot:`<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="auto-run" ${total?'':'disabled'}>${w.length?'Всё равно заполнить':'Заполнить'}</button>`,
    bind:r=>{r.querySelector('#aOver').onchange=e=>over=e.target.checked;r.querySelector('#aMiss').onchange=e=>allowMiss=e.target.checked}};
  });
  ACT['auto-run']=()=>{const res=autofill({overwrite:over,allowMissing:allowMiss});M.close();
    toast(`Назначено: ${res.filled}. ${res.left?`Не нашлось ассистента для ${res.left} — они подсвечены.`:'Все слоты заполнены.'}`)};
}
function autofill(o){
  const ds=range(UI.from,UI.to);const yms=new Set();MISS.clear();
  if(o.overwrite)ds.forEach(d=>forEntries(d,en=>{if(en.assistantId){en.assistantId=null;yms.add(ymOf(d))}}));
  const load=loadMap();let filled=0,left=0;
  ds.forEach(d=>{
    let open=[];forEntries(d,en=>{if(!en.assistantId)open.push(en)});
    while(open.length){
      const ev=open.map(en=>{const cs=classify(d,en,busyMap(d,en.id),load).filter(c=>(c.group==='prio'||c.group==='can')&&(o.allowMissing||!c.missing.length));return{en,cs}});
      ev.sort((x,y)=>x.cs.length-y.cs.length);
      const t=ev[0];
      if(!t.cs.length){
        const all=classify(d,t.en,busyMap(d,t.en.id),load);
        const near=all.filter(c=>c.group==='prio'||c.group==='can');
        MISS.set(t.en.id,near.length?'Свободны только без нужного навыка: '+near.map(c=>c.a.name).join(', '):'Нет свободных ассистентов на эту смену');
        left++;open=open.filter(e=>e!==t.en);continue;
      }
      const sc=c=>(c.group==='prio'?100:0)+c.matched*6-c.missing.length*25-c.load*3+(c.av===t.en.shift?2:0);
      const ranked=t.cs.slice().sort((x,y)=>sc(y)-sc(x)||byName(x.a,y.a));let best=ranked[0];
      if(SET().rates&&SET().cheap){const top=sc(best);const eq=ranked.filter(c=>top-sc(c)<=3&&c.group===best.group&&c.missing.length===best.missing.length);
        const pr=c=>num(c.a.rate)!=null?shiftCost(c.a,t.en.shift):Infinity;eq.sort((x,y)=>pr(x)-pr(y));if(pr(eq[0])<pr(best))best=eq[0]}
      t.en.assistantId=best.a.id;load[best.a.id]=(load[best.a.id]||0)+1;filled++;yms.add(ymOf(d));
      open=open.filter(e=>e!==t.en);
    }
  });
  yms.forEach(markMonth);render();return{filled,left};
}

  const host=document.createElement('div');host.style.cssText='position:absolute;left:-30000px;top:0;width:1123px';host.innerHTML=html;document.body.appendChild(host);
  try{try{await document.fonts.load('400 13px "PT Serif"');await document.fonts.load('700 13px "PT Serif"');await document.fonts.ready}catch(e){}
    const scale=host.offsetHeight*2>15000?1:2;
    return await window.html2canvas(host,{scale,backgroundColor:'#FFFFFF',logging:false,windowWidth:1300})}
  finally{host.remove()}
}
function xmlEsc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function docxXml(g){
  const run=(t,o={})=>`<w:r><w:rPr>${o.b?'<w:b/><w:bCs/>':''}${o.i?'<w:i/><w:iCs/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:''}</w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
  const p=(runs,o={})=>`<w:p><w:pPr><w:spacing w:before="0" w:after="0"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:''}</w:pPr>${runs||''}</w:p>`;
  const n=g.heads.length,TW=15398,DW=1500,CW=Math.floor((TW-DW)/Math.max(1,n));
  const tc=(content,w,fill,span)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span?`<w:gridSpan w:val="${span}"/>`:''}${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}</w:tcPr>${content||p('')}</w:tc>`;
  let b=p(run(g.title,{b:1,sz:22}))+p('');
  b+=`<w:tbl><w:tblPr><w:tblW w:w="${TW}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(x=>`<w:${x} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders><w:tblCellMar><w:top w:w="10" w:type="dxa"/><w:left w:w="70" w:type="dxa"/><w:bottom w:w="10" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr>`;
  b+=`<w:tblGrid><w:gridCol w:w="${DW}"/>${g.heads.map(()=>`<w:gridCol w:w="${CW}"/>`).join('')}</w:tblGrid>`;
  b+=`<w:tr><w:trPr><w:tblHeader/></w:trPr>${tc(p(''),DW)}${g.heads.map(x=>tc(p(run(x,{b:1,i:1}),{jc:'center'}),CW)).join('')}</w:tr>`;
  g.blocks.forEach(bl=>{
    b+=`<w:tr><w:trPr><w:trHeight w:val="150" w:hRule="exact"/></w:trPr>${tc(p(''),TW,'DCE6F1',n+1)}</w:tr>`;
    const R=rowsOf(bl);
    for(let i=0;i<R;i++){
      b+=`<w:tr><w:trPr><w:cantSplit/></w:trPr>${tc(p(bl.label[i]?run(bl.label[i],i===0?{b:1,i:1}:{c:'444444'}):''),DW)}`;
      bl.cols.forEach(c=>{
        if(c.closed){b+=tc(p(i===0?run('Клиника',{b:1,i:1}):i===1?run('не работает',{b:1,i:1}):''),CW,'D9D9D9');return}
        const e=c.lines[i];
        b+=tc(e?p(run(e.name+' '+shiftTime(e.shift)+' ')+run(String(e.chair),{b:1,sz:22}))+(e.sub?p(run(e.sub,{i:1,sz:18,c:e.none?'C00000':'444444'})):''):p(''),CW);
      });
      b+=`</w:tr>`;
    }
  });
  b+=`</w:tbl>`+p(run(g.footer,{b:1,i:1}),{jc:'right'});
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="567" w:right="720" w:bottom="567" w:left="720" w:header="300" w:footer="300" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
// простой zip без сжатия — работает без интернета
function zipStore(files){
  const enc=new TextEncoder();const parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(([name,text])=>{
    const nb=enc.encode(name),db=enc.encode(text),crc=crc32(db);
    const head=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(head,nb,db);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=head.length+nb.length+db.length;
  });
  const csize=central.reduce((x,a)=>x+a.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

  ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'],
  ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
  ['word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
  ['word/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="ru-RU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>'],
  ['word/document.xml',docxXml(g)]]);

async function saveFile(name,data){
  if(STANDALONE){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Файл сохранён в «Загрузки»');return true}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('Сохранение файлов недоступно в этом окне. Откройте страницу на claude.ai');return false}
  try{await dl.save({filename:name,data});toast('Файл сохранён');return true}
  catch(e){const c=e&&e.code;if(c==='declined')return false;if(c==='rate_limited')toast('Окно сохранения уже открыто');else toast('Не удалось сохранить файл');return false}
}

async function copyTable(){
  const rows=[['Дата','День','Клиника','Кресло','Врач','Смена','Ассистент']];
  range(UI.from,UI.to).forEach(d=>forEntries(d,(en,cl,ch)=>rows.push([fmt(d)+'.'+d.slice(0,4),WD[wdOf(d)],cl.name,ch+1,docName(en.doctorId),SH[en.shift].l,asById(en.assistantId)?.name||''])));
  if(rows.length<2){toast('В периоде нет смен');return}
  const txt=rows.map(r=>r.join('\t')).join('\n');
  try{await navigator.clipboard.writeText(txt);toast('Таблица скопирована — вставьте в Excel')}
  catch(e){M.show(()=>({title:'<h2>Скопируйте вручную</h2>',body:`<textarea id="cpy" rows="10" readonly>${esc(txt)}</textarea>`,foot:'<button class="btn primary" data-act="close">Готово</button>',bind:r=>{const t=r.querySelector('#cpy');t.focus();t.select()}}))}
}

ACT['ex-run']=async()=>{
  if(EX.busy)return;const kind=EX.kind,fm=EX.fmt;
  const g=exGrid(kind,EX.cls,range(UI.from,UI.to));if(!g.blocks.length)return;
  const base=kind==='tpl'?KIND.tpl:`${KIND[kind]} ${fmt(UI.from)}-${fmt(UI.to)}`;
  EX.busy=true;M.refresh();
  try{
    if(fm==='docx'){await saveFile(base+'.docx',await buildDocx(g))}
    else if(fm==='png'){
      const cv=await toCanvas(exPageHTML(g,g.blocks));
      EX.img=cv.toDataURL('image/png');
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      EX.busy=false;M.refresh();
      await saveFile(base+'.png',blob);
    }else{
      await loadLib(JSPDF);const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});let first=true;
      for(const blocks of weekChunks(g.blocks)){
        const cv=await toCanvas(exPageHTML(g,blocks));
        if(!first)pdf.addPage();first=false;
        let w=297,h=cv.height*297/cv.width;if(h>210){h=210;w=cv.width*210/cv.height}
        pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(297-w)/2,0,w,h);
      }
      await saveFile(base+'.pdf',pdf.output('blob'));
    }
  }catch(e){toast(e&&e.message==='lib'?(STANDALONE?'Для PDF и картинки нужен интернет. Без интернета используйте «Печать» или Word':'Не загрузились инструменты для файла — проверьте интернет'):'Не удалось подготовить файл')}
  EX.busy=false;if(M.open)M.refresh();
};

/* ---------- backup ---------- */
let BK=null;
ACT['bk-save']=()=>{const data={app:'grafik-assistentov',v:1,saved:new Date().toISOString(),cfg:S.cfg,avail:S.avail,months:S.months};
  saveFile('График ассистентов — копия '+fmt(TODAY)+'.json',JSON.stringify(data))};
function importBackup(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='grafik-assistentov'||!d.cfg)throw 0;
  BK={data:d,when:d.saved?fmtY(iso(new Date(d.saved))):'?'};M.refresh()}catch(e){toast('Это не файл резервной копии графика')}};r.readAsText(f)}
ACT['bk-cancel']=()=>{BK=null;M.refresh()};
ACT['bk-apply']=()=>{if(!BK)return;const d=BK.data;
  const oldA=Object.keys(S.avail),oldM=Object.keys(S.months);
  S.cfg=clone(d.cfg);S.avail=clone(d.avail||{});S.months=clone(d.months||{});normalize();
  markCfg();new Set([...oldA,...Object.keys(S.avail)]).forEach(markAvail);new Set([...oldM,...Object.keys(S.months)]).forEach(markMonth);
  BK=null;MISS.clear();M.close();toast('Данные загружены из файла')};


ACT['av-brush']=b=>{AV.brush=b.dataset.v;AV.refresh()};
ACT['av-day']=b=>{const ds=b.dataset.v;if(!avEditable(ds))return;const cur=(S.avail[AV.aid]||{})[ds];avSet(ds,cur===AV.brush?'none':AV.brush);markAvail(AV.aid);AV.refresh()};
ACT['av-wd']=b=>{const w=+b.dataset.v;avMonthDays().filter(d=>wdOf(d)===w&&avEditable(d)).forEach(d=>avSet(d,AV.brush));markAvail(AV.aid);AV.refresh()};
ACT['av-m']=b=>{const[y,m]=AV.month.split('-').map(Number);const d=new Date(y,m-1+(+b.dataset.v),1);AV.month=iso(d).slice(0,7);AV.refresh()};
ACT['av-clear']=b=>{if(!armed(b,'Очистить весь месяц?'))return;avMonthDays().filter(avEditable).forEach(d=>avSet(d,'none'));markAvail(AV.aid);AV.refresh()};
ACT['rtab']=b=>{UI.rtab=b.dataset.v;saveUI();render();window.scrollTo(0,0)};
ACT_LATE.forEach(f=>f());
render();
initStore();
</script>
