<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>График ассистентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,700&family=Unbounded:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: верхняя полоса с разделами; «Расписание» = широкая доска кресла×даты + колонка ассистентов справа */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --sunk:#E7EDED; --line:#D2DCDC; --ink:#122A2C; --muted:#587173;
  --accent:#0D6D69; --accent-ink:#FFFFFF; --accent-soft:#D4EBE9;
  --am:#B8740F; --am-soft:#FBEBD0; --pm:#4F4FC9; --pm-soft:#E5E5FA; --day:#0D6D69; --day-soft:#D4EBE9;
  --ok:#24804F; --ok-soft:#DAF0E2; --warn:#9C6512; --warn-soft:#FAEED3; --bad:#BC3A33; --bad-soft:#F8DEDC;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --today:#2F6FD6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1718; --surface:#152223; --sunk:#1B2B2C; --line:#2A3E3F; --ink:#E2EDED; --muted:#92A9AA;
  --accent:#3DB2AA; --accent-ink:#03201E; --accent-soft:#133A38;
  --am:#EDB45E; --am-soft:#3A2B12; --pm:#A0A0F6; --pm-soft:#25254B; --day:#3DB2AA; --day-soft:#133A38;
  --ok:#5CC48A; --ok-soft:#15321F; --warn:#E3AA4C; --warn-soft:#382A11; --bad:#F27D74; --bad-soft:#3D1A18; --today:#3F7FE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#152223; --sunk:#1B2B2C; --line:#2A3E3F; --ink:#E2EDED; --muted:#92A9AA;
  --accent:#3DB2AA; --accent-ink:#03201E; --accent-soft:#133A38;
  --am:#EDB45E; --am-soft:#3A2B12; --pm:#A0A0F6; --pm-soft:#25254B; --day:#3DB2AA; --day-soft:#133A38;
  --ok:#5CC48A; --ok-soft:#15321F; --warn:#E3AA4C; --warn-soft:#382A11; --bad:#F27D74; --bad-soft:#3D1A18; --today:#3F7FE6; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tab .ti,.tab .ts,.tab.more{display:none}
@media (max-width:700px){
  .tabs:not(:empty){position:fixed;left:0;right:0;bottom:0;z-index:50;flex-wrap:nowrap;gap:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
  .tabs .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.15;color:var(--muted);background:transparent}
  .tabs .tab[aria-current="true"]{background:transparent;color:var(--accent)}
  .tabs .tab[aria-current="true"] .ti{background:var(--accent-soft)}
  .tab .ti{display:grid;place-items:center;width:44px;height:26px;border-radius:13px;position:relative}
  .tbadge{position:absolute;top:-3px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-weight:700}
  .tabs .tab{font-size:10.5px}
  .tab .tl{display:none} .tab .ts{display:block;max-width:100%;text-align:center;overflow-wrap:anywhere}
  .tab.more{display:flex}
  .top>[data-act="settings"]{display:none}
  .top{gap:6px 12px;padding-block:10px 8px}
  .top .store{font-size:12px}
  .top .bell{margin-left:auto}
  body.has-nav{padding-bottom:84px}
  body.has-nav .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60}
  body.has-nav .envtag{bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:4px}
  body.has-nav .boardwrap.scrollbox{max-height:max(320px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 170px))}
}
.store{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.store.on b{background:var(--ok)} .store.warn b{background:var(--warn)}

main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:500;font-size:14px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 9px;font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select{color:var(--ink);font-weight:400;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}

/* shift chips */
.sh{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:700}
.sh.day{background:var(--day-soft);color:var(--day)} .sh.am{background:var(--am-soft);color:var(--am)} .sh.pm{background:var(--pm-soft);color:var(--pm)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--sunk);font-size:12px;border:1px solid transparent;white-space:nowrap}
.tag.miss{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.pick-tags .tag{cursor:pointer;padding:4px 10px;border:1px solid var(--line);background:var(--surface)}
.pick-tags .tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pick-tags .tag.neg[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}

/* banner */
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.note.info{border-left-color:var(--accent)}

/* schedule layout */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.period{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.status b{color:var(--ink)} .status .bad b{color:var(--bad)}
.sched{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:1000px){.sched{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}
.boardwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
table.board{border-collapse:separate;border-spacing:0;font-size:13px}
.board th,.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
.board thead th{position:sticky;top:0;background:var(--surface);padding:8px 8px;text-align:left;font-weight:600;white-space:nowrap;z-index:2}
.board thead th .d{font-size:15px}
.board thead th.we{color:var(--bad)} .board thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.board .lab{position:sticky;left:0;background:var(--surface);z-index:1;padding:8px 10px;font-weight:600;white-space:nowrap;color:var(--muted);font-size:12px;min-width:74px}
.board thead .lab{z-index:3}
.board tr.cl td{background:var(--sunk);padding:6px 10px;font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:.02em;position:sticky;left:0}
.board td.c{width:168px;min-width:168px;padding:5px;background:var(--surface)}
.board td.c.we{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.ent{border-radius:8px;padding:6px 7px;display:flex;flex-direction:column;gap:5px;background:var(--bg);border:1px solid var(--line)}
.ent+.ent{margin-top:5px}
.ent .h{display:flex;gap:6px;align-items:center}
.ent .doc{border:0;background:none;padding:0;font-weight:600;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .doc:hover{color:var(--accent)}
.ent .tags .tag{font-size:11px;padding:1px 6px}
.as{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;text-align:left;font-size:12.5px;display:flex;align-items:center;gap:6px;width:100%}
.as.empty{border-style:dashed;color:var(--muted)}
.as.empty.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:600}
.as.warn{border-color:var(--warn)}
.as .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.as.warn .dot{background:var(--warn)}
.addent{border:1px dashed var(--line);background:transparent;border-radius:7px;width:100%;padding:3px;color:var(--muted);font-size:12px;margin-top:5px;opacity:.7}
.addent:hover{opacity:1;color:var(--accent);border-color:var(--accent)}
.empty-board{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty-board h2{color:var(--ink)}

/* rail */
.board .cost{font-size:11px;color:var(--muted);flex:none}
.board.vert thead tr:first-child th{top:0} .board.vert thead tr:nth-child(2) th{top:37px}
.board.vert .clh{font-family:var(--font-display);font-weight:500;font-size:12px;background:var(--sunk);letter-spacing:.02em}
.board.vert .chh{font-size:12px;color:var(--muted)}
.board.vert .first{border-left:2px solid var(--line)}
.board.vert .dl{text-align:left;color:var(--ink)}
.board.vert .dl .d{font-size:15px}
.board.vert tr.we .dl{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.board.vert .wer{color:var(--bad);font-size:13px}
.board.vert tr.today .dl{box-shadow:inset 3px 0 0 var(--accent)}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:76px}
@media (max-width:1000px){.rail{position:static}}
.rail summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.rail summary::-webkit-details-marker{display:none}
.rail summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.rail[open] summary .chev{transform:rotate(90deg)}
.rail .list{border-top:1px solid var(--line);max-height:65vh;overflow:auto}
.ra{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
.ra:hover{background:var(--bg)}
.ra .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.ra .meta .z{color:var(--warn);font-weight:600}
.rail .foot{padding:10px 14px;font-size:12px;color:var(--muted)}

/* template grid */
.tpl{border-collapse:separate;border-spacing:0}
.tpl th,.tpl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.tpl thead th{padding:8px;font-weight:600;text-align:left;background:var(--surface)}
.tpl td.c{width:150px;min-width:150px;padding:5px;vertical-align:top}
.tcell{width:100%;min-height:58px;border:1px dashed var(--line);border-radius:8px;background:transparent;display:flex;flex-direction:column;gap:4px;padding:6px;text-align:left}
.tcell:hover{border-color:var(--accent)}
.tcell .e{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px;min-width:0}
.tcell .e span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell .plus{color:var(--muted);font-size:12px;margin:auto}

/* cards list */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.card .k{font-size:12px;color:var(--muted)}
.card .k b{color:var(--ink);font-weight:500}
.ex{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar input{flex:1;min-width:180px}

/* modal */
.mback{position:fixed;inset:0;background:rgb(10 20 22/.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 50px rgb(0 0 0/.25);display:flex;flex-direction:column}
.modal.wide{width:min(720px,100%)}
.mh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 10px}
.mh .ttl{flex:1;min-width:0}
.mb{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:8px;font-size:16px;flex:none}
.grp h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:6px;align-items:center}
.grp h3 .n{background:var(--sunk);border-radius:999px;padding:0 7px;font-weight:700}
.grp.prio h3{color:var(--accent)} .grp.can h3{color:var(--ok)} .grp.never h3{color:var(--bad)}
.cand{display:flex;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left}
.cand+.cand{margin-top:5px}
.cand:hover{border-color:var(--accent)}
.cand .nm{font-weight:600}
.cand .why{font-size:12px;color:var(--muted)}
.cand .r{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);flex:none}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.grp.no .cand,.grp.never .cand{opacity:.72}
.list-empty{font-size:13px;color:var(--muted);padding:2px 0}

/* calendar */
.brush{display:flex;gap:6px;flex-wrap:wrap}
.brush button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.brush button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:2px 0;border:0;background:none;border-radius:6px}
.cal button.wh:hover{background:var(--sunk);color:var(--ink)}
.cal .dd{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cal .dd.out{visibility:hidden}
.cal .dd.day{background:var(--day-soft);border-color:var(--day)} .cal .dd.am{background:var(--am-soft);border-color:var(--am)} .cal .dd.pm{background:var(--pm-soft);border-color:var(--pm)}
.cal .dd small{font-size:10px;font-weight:700}
.cal .dd.day small{color:var(--day)} .cal .dd.am small{color:var(--am)} .cal .dd.pm small{color:var(--pm)}
.cal .dd.inp{outline:2px solid var(--ink);outline-offset:-1px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-family:var(--font-display);font-weight:500;font-size:14px;min-width:140px;text-align:center}

.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
.opt input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.opt.dis{opacity:.5;cursor:default}
.sh3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.preview{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.busy{opacity:.6;pointer-events:none}
/* бумажный вид для экспорта — всегда светлый */
.xp{width:1123px;padding:26px 30px 22px;background:#FFFFFF;color:#000000;font-family:"PT Serif","Times New Roman",Times,serif;font-size:13px;line-height:1.25}
.xp+.xp{border-top:2px dashed #BBBBBB}
.xtop{font-weight:700;font-size:13px;margin-bottom:8px}
.xg{width:100%;border-collapse:collapse;table-layout:fixed}
.xg th,.xg td{border:1px solid #000000;padding:2px 5px;vertical-align:top;overflow:hidden}
.xg th{font-weight:700;font-style:italic;text-align:center;padding:5px}
.xg .xband td{background:#DCE6F1;height:8px;padding:0}
.xg td.xday{font-style:italic} .xg td.xday b{font-weight:700}
.xg td.xday.we b{color:#000000}
.xg td.xcl{background:#D9D9D9;font-weight:700;font-style:italic}
.xch{font-size:14px}
.xsub{display:block;font-style:italic;font-size:12px;color:#444444}
.xsub.xn{color:#C00000}
.xfoot{text-align:right;font-weight:700;font-style:italic;margin-top:6px}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{padding:0!important;background:#FFFFFF!important}
  body>*:not(#printArea){display:none!important}
  body::before{display:none}
  #printArea{display:block}

const Store={
  mode:'local',db:null,dirty:new Set(),ver:{},timers:{},chains:{},readonly:false,sent:{},
  sv:{},base:{},pending:new Set(), // sv — версия документа в базе, base — его содержимое, известное нам
  mark(path){

  },
  body(path){

    if(path==='cfg/private')return splitCfg().priv;
    const[col,id]=path.split('/');
    if(col==='avail'){const o=S.offers[id]&&Object.keys(S.offers[id]).length?S.offers[id]:null;return S.avail[id]||o?Object.assign({dates:clone(S.avail[id]||{})},o?{offers:clone(o)}:{}):null}

      this.chains[path]=prev.then(()=>saveLoop(path)).catch(e=>console.warn(e)).finally(()=>{if(this.ver[path]===v&&!this.pending.has(path))this.dirty.delete(path)});
      return;
    }

      const body=this.body(path);const prev=this.chains[path]||Promise.resolve();
      if(body){const l=this.sent[path]=this.sent[path]||[];l.push(canon(body));if(l.length>8)l.shift();RAWC[path]=canon(body)}else delete RAWC[path];
      this.chains[path]=prev.then(async()=>{
        if(!ORG&&!LEGACY)return;
        const r=body?await SB.from('docs').upsert({path:P(path),data:body,updated_at:new Date().toISOString()}):await SB.from('docs').delete().eq('path',P(path));
        if(r.error){const m=r.error.message||'';toast(/закреплен/i.test(m)?m+'. Изменение не сохранено':/row-level|permission/i.test(m)?'Нет прав на изменение':'Не удалось сохранить. Проверьте интернет');console.warn(r.error)}
      }).finally(()=>{if(this.ver[path]===v)this.dirty.delete(path)});
      return;
    }
    if(this.mode!=='db'){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}this.dirty.delete(path);return}
    const body=this.body(path);
    const prev=this.chains[path]||Promise.resolve();
    this.chains[path]=prev.then(async()=>{
      const ref=this.db.doc(path);
      for(let i=0;i<2;i++){try{body?await ref.set(body):await ref.delete();break}
        catch(e){if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,600+Math.random()*600));continue}writeErr(e);break}}
    }).finally(()=>{if(this.ver[path]===v)this.dirty.delete(path)});
  }
};

let VER_OK=false,OFFLINE=false,CONFLICTS=[];
const cl0=v=>v===undefined?undefined:clone(v);
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const same=(a,b)=>a===b||(a!==undefined&&b!==undefined&&canon(a)===canon(b));
// трёхстороннее объединение: base — что было, mine — мои правки, theirs — что сейчас в базе
function merge3(base,mine,theirs,path,conf){
  if(same(mine,theirs))return cl0(mine);
  if(same(mine,base))return cl0(theirs);
  if(same(theirs,base))return cl0(mine);
  if(isObj(mine)&&isObj(theirs)){const b=isObj(base)?base:{};const out={};
    for(const k of new Set([...Object.keys(mine),...Object.keys(theirs),...Object.keys(b)])){const v=merge3(b[k],mine[k],theirs[k],path.concat(k),conf);if(v!==undefined)out[k]=v}
    return out}
  if(Array.isArray(mine)&&Array.isArray(theirs)){
    const ida=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null);
    if(ida(mine)&&ida(theirs)&&(base===undefined||ida(base))){
      const m=new Map(mine.map(x=>[x.id,x])),t=new Map(theirs.map(x=>[x.id,x])),bm=new Map((base||[]).map(x=>[x.id,x]));
      const out=[];for(const id of[...mine.map(x=>x.id),...theirs.map(x=>x.id).filter(id=>!m.has(id))]){const v=merge3(bm.get(id),m.get(id),t.get(id),path.concat(id),conf);if(v!==undefined)out.push(v)}
      return out}
    if(mine.concat(theirs).every(x=>x===null||typeof x!=='object')){const b=new Set(Array.isArray(base)?base:[]),M=new Set(mine),T=new Set(theirs);
      return[...new Set([...mine,...theirs])].filter(x=>(M.has(x)&&T.has(x))||(M.has(x)&&!b.has(x))||(T.has(x)&&!b.has(x)))}
  }
  conf.push(path);return cl0(mine); // одно и то же изменили оба — оставляем своё и сообщаем
}
function applyMerged(path,data){

  applyDoc(path,data);
}
function conflictLabel(path,p){
  const[col,id]=path.split('/');
  if(col==='months'||col==='pub'){const[,d,cid,ch,eid]=p;if(!d)return'График';const c=clById(cid);let doc='';
    if(eid){const f=withSrc(col==='pub',()=>findEntry(d,eid));if(f)doc=', '+docName(f.en.doctorId)}
    return`Смена ${fmt(d)}${c?', '+c.name:''}${ch!==undefined?', кресло '+(+ch+1):''}${doc}`}
  if(col==='cfg'){const[k,x]=p;
    if(k==='doctors')return`Карточка врача «${docById(x)?.name||''}»`;
    if(k==='assistants')return`Карточка ассистента «${asById(x)?.name||''}»`;
    if(k==='clinics')return`Клиника «${clById(x)?.name||''}» (кресла и базовая неделя)`;
    return{tags:'Навыки',settings:'Настройки',collect:'Сбор дат',calls:'Клич',publishedAt:'Публикация'}[k]||'Общие данные'}
  if(col==='avail')return`Даты ассистента «${asById(id)?.name||''}»${p[1]?' на '+fmt(p[1]):''}`;
  return'Данные';
}
function reportConflicts(path,conf,by){
  const who=(MEMBERS.find(u=>u.user_id===by)||{});const name=who.name||who.login||'другой ответственный';
  const labels=[...new Set(conf.map(p=>conflictLabel(path,p)))];
  labels.forEach(l=>CONFLICTS.push({t:l,s:`Одновременно изменил(а) ${name}. Оставлено ваше значение — проверьте.`,at:Date.now()}));
  toast(`${labels[0]}: одновременно изменил(а) ${name}. Оставлено ваше значение${labels.length>1?` (и ещё ${labels.length-1})`:''}`,9000);updateBell();
}
const isNetErr=e=>!navigator.onLine||/fetch|network|load failed|timeout|ERR_|aborted/i.test((e&&(e.message||e.details))||String(e||''));
async function saveLoop(path){
  if(!ORG&&!LEGACY)return;
  for(let attempt=0;attempt<6;attempt++){
    const body=Store.body(path);const base=Store.sv[path]??null;
    let r;try{r=await SB.rpc('save_doc',{p:P(path),d:body??null,base})}catch(e){r={error:e}}
    if(r.error){
      if(isNetErr(r.error)){goOffline(path);return}
      const m=r.error.message||'';
      if(/save_doc|PGRST202|function/i.test(m)&&/find|exist|not/i.test(m)){VER_OK=false;Store.pending.delete(path);Store.flush(path);return}
      toast(/закреплен/i.test(m)?m+'. Изменение не сохранено':/row-level|permission/i.test(m)?'Нет прав на изменение':'Не удалось сохранить: '+m);console.warn(r.error);return}
    Store.pending.delete(path);if(OFFLINE)goOnline();
    const res=r.data||{};
    if(typeof res.ok!=='boolean'){VER_OK=false;Store.flush(path);return} // база без поддержки версий — сохраняем по-старому
    if(res.ok){Store.sv[path]=res.version??undefined;Store.base[path]=cl0(body??undefined);return}
    if(res.denied){toast('Нет прав на изменение этих данных');return}
    if(res.version==null&&res.data==null){toast('Не удалось сохранить изменение');return}
    // кто-то сохранил раньше нас — объединяем
    const theirs=res.data===null||res.data===undefined?undefined:res.data;const mine=Store.body(path)??undefined;const conf=[];
    const merged=merge3(Store.base[path],mine,theirs,[],conf);
    applyMerged(path,merged);Store.base[path]=cl0(theirs);Store.sv[path]=res.version;
    if(conf.length)reportConflicts(path,conf,res.by);
    renderSoft();
  }
  toast('Не удалось сохранить из-за частых одновременных правок. Повторите действие');
}

// подтянуть свежие данные: после обрыва связи, долгого простоя и регулярно — на случай, если «живой» канал подвис
const RAWC={};let RT_OK=false,RESYNC_BUSY=false;
async function resync(full){
  if(!SB||!AUTHED||DEMO||(!ORG&&!LEGACY)||RESYNC_BUSY)return;RESYNC_BUSY=true;
  try{
    const pre=LEGACY?'':ORG+':';const rel=p=>p.slice(pre.length);let ch=false;
    const like=q=>LEGACY?q:q.like('path',pre+'%');
    if(VER_OK){
      const{data:vs,error}=await like(SB.from('docs').select('path,version'));if(error)return;
      const need=[],seen=new Set();
      (vs||[]).forEach(r=>{const p=rel(r.path);seen.add(p);if(!Store.dirty.has(p)&&(Store.sv[p]||0)<r.version)need.push(r.path)});
      if(need.length){const{data,error:e2}=await SB.from('docs').select('path,data,version').in('path',need);if(e2)return;
        (data||[]).forEach(r=>{const p=rel(r.path);if(Store.dirty.has(p))return;applyDoc(p,r.data);Store.sv[p]=r.version;Store.base[p]=cl0(Store.body(p)??undefined);ch=true})}
      Object.keys(Store.sv).forEach(p=>{if(!seen.has(p)&&!Store.dirty.has(p)){removeDoc(p);delete Store.sv[p];delete Store.base[p];ch=true}});
    }else{
      if(!full&&RT_OK)return; // без версий полную сверку делаем только когда «живой» канал не работает
      const{data,error}=await like(SB.from('docs').select('path,data'));if(error)return;const seen=new Set();
      (data||[]).forEach(r=>{if(LEGACY&&r.path.includes(':'))return;const p=rel(r.path);seen.add(p);if(Store.dirty.has(p))return;const c=canon(r.data);
        if(RAWC[p]!==c){applyDoc(p,r.data);RAWC[p]=c;ch=true}});
      Object.keys(RAWC).forEach(p=>{if(!seen.has(p)&&!Store.dirty.has(p)){removeDoc(p);delete RAWC[p];ch=true}});
    }
    if(ch)renderSoft();
  }finally{RESYNC_BUSY=false}
}

const presWhere=()=>UI.tab==='sched'?({board:'edit',week:'week',amap:'amap',pub:'pub'}[UI.mode]||'edit'):UI.tab;
function startPresence(){
  if(!SB||!isAdmin()||LEGACY||!ORG)return;
  if(PRES){try{SB.removeChannel(PRES)}catch(e){}PRES=null;PEERS=[]}
  const o=ORGS.find(x=>x.id===ORG)||{};
  PRES=SB.channel(`p-${ORG}-${o.code||'x'}`,{config:{presence:{key:MYID||'me'}}});
  PRES.on('presence',{event:'sync'},()=>{const st=PRES.presenceState();
    PEERS=Object.entries(st).filter(([k])=>k!==MYID).map(([k,a])=>Object.assign({id:k},a[a.length-1]||{}));updatePresence()});
  PRES.subscribe(st=>{if(st==='SUBSCRIBED'){LAST_TRACK='';trackPresence()}});
}
function trackPresence(){if(!PRES||!AUTHED)return;const w=presWhere();if(w===LAST_TRACK)return;LAST_TRACK=w;
  try{PRES.track({name:(ME&&(ME.name||ME.login))||'',where:w,at:Date.now()})}catch(e){}}
function updatePresence(){const el=$('#presence');if(!el)return;
  if(!PEERS.length||!isAdmin()){el.hidden=true;el.innerHTML='';}
  else{el.hidden=false;el.innerHTML=PEERS.map(p=>`<span class="pp" title="${esc(p.name)} — ${esc(WHERE_L[p.where]||'в программе')}">${esc((p.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`).join('')+`<span class="ppt">${PEERS.length===1?esc(PEERS[0].name)+' '+esc(WHERE_L[PEERS[0].where]||'в программе'):'Ещё в программе: '+PEERS.length}</span>`}
  const n=$('#peerNote');const ed=PEERS.filter(p=>p.where==='edit');
  if(n){n.hidden=!(ed.length&&editing());n.innerHTML=ed.length?`<span>Сейчас график также редактирует: <b>${ed.map(p=>esc(p.name)).join(', ')}</b>. Правки объединяются автоматически, но лучше не менять одни и те же смены одновременно.</span>`:''}
}

function applyDoc(path,data){const[col,id]=path.split('/');

  }

  const fail=e=>{clearTimeout(timer);setStore('warn','Хранилище недоступно')};

function dayObj(date,create){const ym=ymOf(date);const SRC=create?S.months:monthsSrc();if(!SRC[ym]){if(!create)return null;SRC[ym]={}}const m=SRC[ym];if(!m[date]){if(!create)return null;m[date]={}}return m[date]}
function cellArr(date,cid,ch,create){const d=dayObj(date,create);if(!d)return[];if(!d[cid]){if(!create)return[];d[cid]={}}const c=d[cid];if(!c[ch]){if(!create)return[];c[ch]=[]}return c[ch]}
function forEntries(date,fn){const d=dayObj(date,false);if(!d)return;for(const cl of S.cfg.clinics){const c=d[cl.id];if(!c)continue;for(let ch=0;ch<cl.chairs;ch++){(c[ch]||[]).forEach(en=>fn(en,cl,ch))}}}
function findEntry(date,eid){let r=null;forEntries(date,(en,cl,ch)=>{if(en.id===eid)r={en,cl,ch}});return r}
const overlap=(a,b)=>a==='day'||b==='day'||a===b;
function loadMap(){const m={};range(UI.from,UI.to).forEach(d=>forEntries(d,en=>{if(en.assistantId)m[en.assistantId]=(m[en.assistantId]||0)+1}));return m}
function busyMap(date,exceptId){const m={};forEntries(date,(en,cl)=>{if(en.id===exceptId||!en.assistantId)return;(m[en.assistantId]=m[en.assistantId]||[]).push({shift:en.shift,label:cl.name+', '+docName(en.doctorId)})});return m}
function classify(date,en,busy,load){
  const doc=docById(en.doctorId);const need=en.tags||[];
  return S.cfg.assistants.map(a=>{
    const av=(S.avail[a.id]||{})[date]||null;
    const missing=need.filter(t=>!a.tags.includes(t)&&tagById(t));
    const matched=need.filter(t=>a.tags.includes(t)).length;
    const b=(busy[a.id]||[]).find(x=>overlap(x.shift,en.shift));
    let group,reason='',sub='';
    if(doc&&doc.block.includes(a.id)){group='never';reason='не ставить к этому врачу'}
    else if(b){group='no';sub='busy';reason='занят: '+b.label}
    else if(!av){group='no';sub='noday';reason='дата не отмечена'}
    else if(!(av==='day'||av===en.shift)){group='no';sub='shift';reason='может только '+SH[av].l.toLowerCase()}
    else if(doc&&doc.prio.includes(a.id))group='prio';
    else group='can';
    return{a,av,missing,matched,group,sub,reason,load:load[a.id]||0};
  });
}
const sortCands=arr=>arr.sort((x,y)=>x.missing.length-y.missing.length||x.load-y.load||byName(x.a,y.a));
function entryWarn(date,en){

  if(!c)return'';if(c.group==='no'||c.group==='never')return c.reason;

}

const M={open:false,fn:null,wide:false,
  show(fn,wide){this.fn=fn;this.wide=!!wide;this.open=true;this.refresh(true)},
  refresh(first){if(!this.open)return;const c=this.fn();const root=$('#modalRoot');
    const sc=root.querySelector('.mback')?.scrollTop||0;
    root.innerHTML=`<div class="mback" data-act="mback"><div class="modal ${this.wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><div class="ttl">${c.title}</div><button class="x" data-act="close" aria-label="Закрыть">×</button></div><div class="mb">${c.body}</div>${c.foot?`<div class="mf">${c.foot}</div>`:''}</div></div>`;
    if(!first)root.querySelector('.mback').scrollTop=sc;
    c.bind&&c.bind(root);
  },
  close(){this.open=false;this.fn=null;$('#modalRoot').innerHTML='';render()}
};

function openPicker(date,eid){
  NP={open:false,on:a=>{const f=findEntry(date,eid);if(!f)return;f.en.assistantId=a.id;MISS.delete(f.en.id);markMonth(ymOf(date));M.close();toast(a.name+' добавлен(а) и поставлен(а) в смену')}};
  M.show(()=>{
    const f=findEntry(date,eid);if(!f)return{title:'Смена удалена',body:''};
    const{en,cl}=f;const load=loadMap();
    const cs=classify(date,en,busyMap(date,en.id),load);
    const off=c=>!!(S.offers[c.a.id]||{})[en.id]&&c.group!=='never';
    const groups=[['prio','Откликнулись',off],['prio','Приоритет',c=>c.group==='prio'&&!off(c)],['can','Могут в эту смену',c=>c.group==='can'&&!off(c)],['no','Заняты у другого врача',c=>c.sub==='busy'&&!off(c)],['no','Отметили другое время',c=>c.sub==='shift'&&!off(c)],['no','Не отметили этот день',c=>c.sub==='noday'&&!off(c)],['never','Точно не ставить',c=>c.group==='never']];
    const body=groups.map(([g,l,f],gi)=>{const arr=sortCands(cs.filter(f));if(!arr.length&&(gi===0||gi>2))return'';
      return`<div class="grp ${g}"><h3>${l}<span class="n num">${arr.length}</span></h3>${arr.map(c=>{
        const why=[c.sub==='noday'?'':c.reason.replace(/^занят: /,''),c.missing.length?'нет навыка: '+c.missing.map(t=>tagById(t)?.name).join(', '):'' ].filter(Boolean).join(' · ');
        return`<button class="cand ${en.assistantId===c.a.id?'cur':''}" data-act="assign" data-d="${date}" data-e="${eid}" data-a="${c.a.id}">
          <span><span class="nm">${esc(c.a.name)}</span>${why?`<br><span class="why">${esc(why)}</span>`:''}</span>
          <span class="r num">${c.av?SH[c.av].l:''}<br>${c.load} смен${SET().rates&&num(c.a.rate)!=null?' · '+rub(shiftCost(c.a,en.shift)):''}</span></button>`}).join('')||'<div class="list-empty">—</div>'}</div>`}).join('');
    const tg=(en.tags||[]).map(t=>tagById(t)).filter(Boolean);
    return{title:`<h2>${esc(docName(en.doctorId))}</h2><p class="sub">${esc(cl.name)} · ${fmtL(date)} · ${SH[en.shift].l}${tg.length?' · нужно: '+tg.map(t=>esc(t.name)).join(', '):''}</p>`,

  });

  };

}

}
function removeAssistants(ids){
  S.cfg.assistants=S.cfg.assistants.filter(a=>!ids.includes(a.id));
  S.cfg.doctors.forEach(d=>{d.prio=d.prio.filter(x=>!ids.includes(x));d.block=d.block.filter(x=>!ids.includes(x))});markCfg();

/* ---------- availability ---------- */
let AV={month:null,brush:'day',aid:null,refresh:()=>{}};
function availCal(aid){
  const av=S.avail[aid]||{};const[y,m]=AV.month.split('-').map(Number);
  const first=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();const off=(first.getDay()+6)%7;
  const mine=ROLE()==='assistant';const assigned=new Set();
  if(mine){const src=monthsSrc();Object.keys(src).forEach(ym=>Object.keys(src[ym]).forEach(d=>forEntries(d,en=>{if(en.assistantId===aid)assigned.add(d)})))}
  let cal=WD.map((w,i)=>`<button class="wh" data-act="av-wd" data-v="${i}" title="Отметить все ${w} месяца">${w}</button>`).join('');
  for(let i=0;i<off;i++)cal+=`<span class="dd out"></span>`;
  let cnt=0;
  for(let d=1;d<=days;d++){const ds=iso(new Date(y,m-1,d));const v=av[ds];if(v)cnt++;
    const ring=mine?assigned.has(ds):(ds>=UI.from&&ds<=UI.to);const past=mine&&ds<TODAY;const lk=lockedFor(ds),oc=openFor(ds);
    cal+=`<button class="dd ${v||''} ${ring?'inp':''} ${lk?'lock':''} ${oc?'coll':''}" data-act="av-day" data-v="${ds}" ${past||(mine&&lk)?'disabled':''} ${past?'style="opacity:.4"':''} aria-label="${ds} ${v?SH[v].l:'нет'}${lk?', закреплено':''}" title="${lk?'Закреплено — менять нельзя':oc?'Отметить до '+fmt(oc.deadline):''}">${d}${v?`<small>${SH[v].s}</small>`:''}</button>`}
  const coll=activeColl().filter(c=>c.to>=TODAY);
  const banner=coll.map(c=>`<div class="note ${daysLeft(c.deadline)<=2?'':'info'}" style="margin:0"><span><b>Отметьте даты на ${fmt(c.from)} – ${fmt(c.to)} до ${fmt(c.deadline)}</b> · ${leftText(c)}. После этого даты за этот период закрепятся и менять их будет нельзя.</span></div>`).join('');
  return`${banner}<div class="brush">${['day','am','pm'].map(k=>`<button data-act="av-brush" data-v="${k}" aria-pressed="${AV.brush===k}">${shChip(k)} ${SH[k].l}</button>`).join('')}<button data-act="av-brush" data-v="none" aria-pressed="${AV.brush==='none'}">Стереть</button></div>
    <div class="mnav"><button class="btn sm" data-act="av-m" data-v="-1" aria-label="Предыдущий месяц">‹</button><b>${MN[m-1]} ${y}</b><button class="btn sm" data-act="av-m" data-v="1" aria-label="Следующий месяц">›</button><span class="spacer"></span><span class="sub num">${cnt} дн.</span></div>
    <div class="cal">${cal}</div>
    ${(S.cfg.collect||[]).length?`<div class="legend"><span><i class="lg coll"></i> идёт сбор дат</span><span><i class="lg lock"></i> закреплено</span></div>`:''}
    <p class="sub" style="margin:0">Нажмите на день недели в шапке — режим применится ко всем таким дням месяца. ${mine?'Обведены дни, где вы уже стоите в графике: если уберёте такой день, администратор это увидит.':'Обведены дни текущего периода графика.'}</p>`;
}
function openAvail(aid){
  const a=asById(aid);if(!a)return;
  AV.month=AV.month||ymOf(UI.from);AV.aid=aid;AV.refresh=()=>M.refresh();
  M.show(()=>({title:`<h2>${esc(a.name)}</h2><p class="sub">Когда может выйти на работу. Выберите режим и нажимайте на дни.</p>`,
    body:availCal(aid),

function avSet(ds,v){const aid=AV.aid;S.avail[aid]=S.avail[aid]||{};if(v==='none')delete S.avail[aid][ds];else S.avail[aid][ds]=v}
function avMonthDays(){const[y,m]=AV.month.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>iso(new Date(y,m-1,i+1)))}
const avEditable=ds=>isAdmin()||(ds>=TODAY&&!lockedFor(ds));

/* ---------- публикация ---------- */
function dayCanon(src,d){const x=(src[ymOf(d)]||{})[d];if(!x)return'';const c={};Object.keys(x).forEach(k=>{const ch=x[k];const o={};Object.keys(ch).forEach(n=>{if(ch[n]&&ch[n].length)o[n]=ch[n]});if(Object.keys(o).length)c[k]=o});return Object.keys(c).length?canon(c):''}
function unpubDays(from,to){if(!SUPA_ON)return[];const a=from||UI.from,b=to||UI.to;
  // смотрим период на экране и всё будущее, что уже было опубликовано или есть в черновике
  const ds=new Set(range(a,b));if(!from){[S.months,S.pub].forEach(src=>Object.keys(src).forEach(ym=>Object.keys(src[ym]).forEach(d=>{if(d>=TODAY)ds.add(d)})))}
  return[...ds].sort().filter(d=>dayCanon(S.months,d)!==dayCanon(S.pub,d))}
const unpubCount=()=>{try{return isAdmin()&&SUPA_ON?unpubDays().length:0}catch(e){return 0}};
function openPublish(){
  let from=UI.from,to=UI.to;
  M.show(()=>{const ds=range(from,to);const ch=unpubDays(from,to);
    let empty=0,total=0;withSrc(false,()=>ds.forEach(d=>forEntries(d,en=>{total++;if(!en.assistantId)empty++})));
    const all=unpubDays();const outside=all.filter(d=>d<from||d>to);
    return{title:'<h2>Опубликовать расписание</h2><p class="sub">После публикации сотрудники увидят это расписание, а ассистенты и врачи получат уведомления об изменениях в своих сменах.</p>',
    body:`<div class="row"><label class="f">С<input type="date" id="pbFrom" value="${from}"></label><label class="f">По<input type="date" id="pbTo" value="${to}"></label></div>
      ${ch.length?`<p>Изменится дней: <b class="num">${ch.length}</b> — ${ch.slice(0,10).map(fmt).join(', ')}${ch.length>10?'…':''}</p>`:'<p class="okline">В этом периоде опубликованное уже совпадает с редактируемым.</p>'}
      ${empty?`<div class="note">В периоде ${empty} из ${total} смен без ассистента. Их сотрудники увидят как «ассистент не назначен».</div>`:''}
      ${outside.length?`<p class="sub" style="margin:0">Вне выбранного периода есть ещё неопубликованные дни: ${outside.slice(0,8).map(fmt).join(', ')}${outside.length>8?'…':''}. Расширьте период, если хотите опубликовать и их.</p>`:''}`,
    foot:`<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="pub-run" ${ch.length?'':'disabled'}>Опубликовать</button>`,
    bind:r=>{r.querySelector('#pbFrom').onchange=e=>{if(e.target.value){from=e.target.value;if(to<from)to=from;M.refresh()}};r.querySelector('#pbTo').onchange=e=>{if(e.target.value&&e.target.value>=from){to=e.target.value;M.refresh()}}}};
  });
  ACT['pub-run']=()=>{const ch=unpubDays(from,to);const yms=new Set();
    ch.forEach(d=>{const ym=ymOf(d);const src=(S.months[ym]||{})[d];S.pub[ym]=S.pub[ym]||{};if(src)S.pub[ym][d]=clone(src);else delete S.pub[ym][d];yms.add(ym)});
    yms.forEach(markPub);S.cfg.publishedAt=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});markCfg();
    M.close();toast(`Опубликовано: ${ch.length} дн. Сотрудники уже видят новое расписание`)};
}

/* ---------- клич на свободные смены ---------- */
const offersFor=eid=>S.cfg.assistants.filter(a=>(S.offers[a.id]||{})[eid]);
/* отклики на пустые места: pub=true — опубликованный график, false — редактируемый */
function scanFuture(pub,fn){withSrc(pub,()=>{const src=monthsSrc();Object.keys(src).sort().forEach(ym=>Object.keys(src[ym]).sort().forEach(d=>{if(d>=TODAY)forEntries(d,(en,cl,ch)=>fn(d,en,cl,ch))}))})}
function offerTargets(pub){const out=[];scanFuture(pub,(d,en,cl,ch)=>{if(en.assistantId)return;const as=offersFor(en.id);if(as.length)out.push({d,en,cl,ch,as})});return out}
function myOffers(card){const o=S.offers[card]||{};const out=[];if(!card||!Object.keys(o).length)return out;
  scanFuture(true,(d,en,cl,ch)=>{if(o[en.id])out.push({d,en,cl,ch,st:!en.assistantId?'wait':en.assistantId===card?'ok':'taken'})});return out}
function openOfferPub(d,eid){
  M.show(()=>{const card=myCard();const f=withSrc(true,()=>findEntry(d,eid));
    if(!f)return{title:'<h2>Смена не найдена</h2>',body:'<p class="sub">Похоже, расписание изменилось. Обновите страницу.</p>',foot:'<button class="btn" data-act="close">Закрыть</button>'};
    const{en,cl,ch}=f;const on=!!(S.offers[card]||{})[eid];
    const busy=withSrc(true,()=>(busyMap(d,eid)[card]||[]).find(x=>overlap(x.shift,en.shift)));
    const av=(S.avail[card]||{})[d];
    let body=`<p style="margin-top:0"><b>${fmtL(d)}</b> · ${esc(shiftTime(en.shift))}<br>${esc(cl.name)}, кресло ${ch+1}<br>Врач: ${esc(docName(en.doctorId))}</p>`;
    let btn='';
    if(en.assistantId)body+=en.assistantId===card?'<p class="okline">Вы стоите на этой смене.</p>':'<div class="note">На эту смену уже поставили другого ассистента.</div>';
    else if(on){body+='<div class="note info">Отклик на рассмотрении у ответственного. Когда вас поставят, смена появится в «Мои смены», и придёт уведомление.</div>';btn=`<button class="btn danger" data-act="pub-offer" data-e="${eid}">Отменить отклик</button>`}
    else if(busy)body+=`<div class="note">В это время у вас уже есть смена: ${esc(busy.label)}.</div>`;
    else{body+=`<p class="sub">Ответственный увидит отклик и, если всё подходит, поставит вас на эту смену.</p>${av&&(av==='day'||av===en.shift)?'':'<p class="sub">Этот день у вас не отмечен как рабочий — откликнуться всё равно можно.</p>'}`;btn=`<button class="btn primary" data-act="pub-offer" data-e="${eid}">Откликнуться</button>`}
    return{title:'<h2>Свободное место</h2>',body,foot:`<button class="btn" data-act="close">Закрыть</button><span class="spacer"></span>${btn}`}});
}
function callItems(){const out=[];(S.cfg.calls||[]).forEach(c=>(c.items||[]).forEach(it=>{if(it.d>=TODAY)out.push(Object.assign({call:c},it))}));return out.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:SHO[x.shift]-SHO[y.shift])}
function pruneCalls(){if(!SUPA_ON||!(S.cfg.calls||[]).length)return;let ch=false;
  withSrc(false,()=>S.cfg.calls.forEach(c=>{const n=c.items.filter(it=>{if(it.d<TODAY)return false;const f=findEntry(it.d,it.eid);return f&&!f.en.assistantId});if(n.length!==c.items.length){c.items=n;ch=true}}));
  const k=S.cfg.calls.filter(c=>c.items.length);if(k.length!==S.cfg.calls.length){S.cfg.calls=k;ch=true}
  if(ch)markCfg()}
function openCalls(){
  let from=UI.from<TODAY?TODAY:UI.from,to=UI.to,note='';
  M.show(()=>{
    const open=[];withSrc(false,()=>range(from,to).forEach(d=>{if(d<TODAY)return;forEntries(d,(en,cl,ch)=>{if(!en.assistantId)open.push({d,eid:en.id,cid:cl.id,ch,shift:en.shift,doc:docName(en.doctorId),clinic:cl.name})})}));
    const inCall=new Set(callItems().map(i=>i.eid));const fresh=open.filter(o=>!inCall.has(o.eid));
    const items=callItems();
    return{title:'<h2>Клич на свободные смены</h2><p class="sub">Ассистенты увидят смены без ассистента и смогут откликнуться «Могу выйти». Вы выбираете, кого поставить.</p>',
    body:`<div class="newp"><b>Новый клич</b><div class="row">
        <label class="f">С<input type="date" id="kFrom" value="${from}"></label><label class="f">По<input type="date" id="kTo" value="${to}"></label></div>
        <label class="f">Комментарий для ассистентов (необязательно)<input type="text" id="kNote" value="${esc(note)}" placeholder="Например: очень нужны люди на праздники"></label>
        <p class="sub" style="margin:0">${fresh.length?`Смен без ассистента в периоде: <b class="num" style="color:var(--ink)">${fresh.length}</b>${open.length>fresh.length?` (ещё ${open.length-fresh.length} уже в кличе)`:''}`:'В этом периоде нет новых смен без ассистента.'}</p>
        <div><button class="btn primary" data-act="call-send" ${fresh.length?'':'disabled'}>Отправить ассистентам</button></div></div>
      ${items.length?`<div class="grp"><h3>Сейчас в кличе<span class="n num">${items.length}</span></h3>${items.map(it=>{const of=offersFor(it.eid);
        return`<div class="urow"><div class="row" style="gap:8px"><span style="flex:1;min-width:0"><span class="nm">${fmt(it.d)} ${WD[wdOf(it.d)].toLowerCase()} · ${esc(shiftTime(it.shift))}</span><br><span class="why">${esc(it.clinic)}, кресло ${it.ch+1} · ${esc(it.doc)}</span></span>
          <button class="btn sm ghost" data-act="call-drop" data-e="${it.eid}">Убрать</button></div>
          ${of.length?`<div class="row" style="gap:6px"><span class="sub">Откликнулись:</span>${of.map(a=>`<button class="btn sm primary" data-act="call-take" data-d="${it.d}" data-e="${it.eid}" data-a="${a.id}">Поставить: ${esc(a.name)}</button>`).join('')}</div>`:'<span class="sub">Пока никто не откликнулся</span>'}</div>`}).join('')}</div>`:''}`,
    foot:`${items.length?'<button class="btn danger" data-act="call-end">Закрыть весь клич</button>':''}<span class="spacer"></span><button class="btn primary" data-act="close">Готово</button>`,
    bind:r=>{r.querySelector('#kFrom').onchange=e=>{if(e.target.value){from=e.target.value;M.refresh()}};r.querySelector('#kTo').onchange=e=>{if(e.target.value){to=e.target.value;M.refresh()}};r.querySelector('#kNote').oninput=e=>{note=e.target.value}}};
  },true);
  ACT['call-send']=()=>{const inCall=new Set(callItems().map(i=>i.eid));const items=[];
    withSrc(false,()=>range(from,to).forEach(d=>{if(d<TODAY)return;forEntries(d,(en,cl,ch)=>{if(!en.assistantId&&!inCall.has(en.id))items.push({d,eid:en.id,cid:cl.id,ch,shift:en.shift,doc:docName(en.doctorId),clinic:cl.name})})}));
    if(!items.length)return;S.cfg.calls=(S.cfg.calls||[]).concat([{id:uid(),at:new Date().toISOString(),note:note.trim(),items}]);markCfg();note='';M.refresh();render();
    toast(`Клич отправлен: ${items.length} смен. Ассистенты увидят его у себя`)};
  ACT['call-drop']=b=>{S.cfg.calls.forEach(c=>c.items=c.items.filter(i=>i.eid!==b.dataset.e));S.cfg.calls=S.cfg.calls.filter(c=>c.items.length);markCfg();M.refresh();render()};
  ACT['call-end']=b=>{if(!armed(b,'Точно закрыть?'))return;S.cfg.calls=[];markCfg();M.refresh();render()};
  ACT['call-take']=b=>{const f=withSrc(false,()=>findEntry(b.dataset.d,b.dataset.e));if(!f){toast('Смена не найдена');return}
    f.en.assistantId=b.dataset.a;markMonth(ymOf(b.dataset.d));pruneCalls();M.refresh();render();toast(asById(b.dataset.a)?.name+' поставлен(а). Не забудьте опубликовать')};
}
function viewCallsStaff(card){
  const items=callItems();const mine=S.offers[card]||{};
  const busy=it=>{let b=false;forEntries(it.d,en=>{if(en.assistantId===card&&overlap(en.shift,it.shift))b=true});return b};
  const notes=[...new Set(items.map(i=>i.call.note).filter(Boolean))];
  let h='',last='';
  items.forEach(it=>{if(it.d!==last){if(last)h+='</div>';h+=`<div class="myday"><div class="mydate ${wdOf(it.d)>4?'we':''}"><b class="num">${fmt(it.d)}</b><span>${DAYF[wdOf(it.d)]}</span></div>`;last=it.d}
    const on=!!mine[it.eid],bz=busy(it);
    h+=`<div class="myshift">${shChip(it.shift)}<div style="flex:1;min-width:0"><div class="myt"><b>${esc(shiftTime(it.shift))}</b> · ${esc(it.clinic)}, кресло ${it.ch+1}</div><div class="mym">${esc(it.doc)}</div></div>
      ${bz?'<span class="sub">вы заняты</span>':`<button class="btn sm ${on?'':'primary'}" data-act="call-offer" data-e="${it.eid}">${on?'Отменить отклик':'Могу выйти'}</button>`}</div>`});
  if(last)h+='</div>';
  return`<div><h1>Свободные смены</h1><p class="sub">Ответственному не хватает ассистентов на эти смены. Нажмите «Могу выйти» — он увидит отклик и решит, кого поставить.</p></div>
    ${notes.map(n=>`<div class="note info">${esc(n)}</div>`).join('')}
    ${items.length?`<div class="mylist">${h}</div>`:'<div class="boardwrap"><div class="empty-board"><h2>Свободных смен нет</h2><p>Когда ответственный объявит клич, смены появятся здесь.</p></div></div>'}`;
}

/* ---------- сбор дат с дедлайном ---------- */
const daysLeft=dl=>Math.round((pd(dl)-pd(TODAY))/864e5);
const collLocked=c=>TODAY>c.deadline;
function lockedFor(ds){return(S.cfg.collect||[]).find(c=>collLocked(c)&&ds>=c.from&&ds<=c.to)||null}
function openFor(ds){return(S.cfg.collect||[]).find(c=>!collLocked(c)&&ds>=c.from&&ds<=c.to)||null}
const activeColl=()=>(S.cfg.collect||[]).filter(c=>!collLocked(c)).sort((a,b)=>a.deadline<b.deadline?-1:1);
const leftText=c=>{const n=daysLeft(c.deadline);return n===0?'последний день — сегодня':n===1?'остался 1 день':n<5?`осталось ${n} дня`:`осталось ${n} дней`};
function openCollect(){
  let nf={from:UI.from,to:UI.to,deadline:addDays(UI.from,-7)<TODAY?TODAY:addDays(UI.from,-7)};
  M.show(()=>{const list=(S.cfg.collect||[]).slice().sort((a,b)=>a.from<b.from?1:-1);
    const filled=c=>S.cfg.assistants.filter(a=>range(c.from,c.to).some(d=>(S.avail[a.id]||{})[d]));
    return{title:'<h2>Сбор дат от ассистентов</h2><p class="sub">Укажите период и срок, до которого ассистенты должны отметить, когда могут работать. После срока даты этого периода закрепляются: ассистенты их уже не изменят, а вы — можете.</p>',
    body:`<div class="newp"><b>Новый сбор</b><div class="row">
        <label class="f">Даты с<input type="date" id="cFrom" value="${nf.from}"></label><label class="f">по<input type="date" id="cTo" value="${nf.to}"></label>
        <label class="f">Отметить до (включительно)<input type="date" id="cDl" value="${nf.deadline}"></label>
        <button class="btn primary" data-act="coll-add">Добавить</button></div></div>
      ${list.length?`<div class="grp"><h3>Периоды<span class="n num">${list.length}</span></h3>${list.map(c=>{const f=filled(c);const miss=S.cfg.assistants.filter(a=>!f.includes(a));
        return`<div class="urow"><div class="row" style="gap:8px"><span style="flex:1;min-width:0"><span class="nm">${fmt(c.from)} – ${fmt(c.to)}</span><br>
        <span class="why">${collLocked(c)?`закреплено с ${fmt(addDays(c.deadline,1))}`:`подать до ${fmt(c.deadline)} · ${leftText(c)}`} · отметились ${f.length} из ${S.cfg.assistants.length}${miss.length&&!collLocked(c)?' · нет: '+esc(miss.map(a=>a.name).join(', ')):''}</span></span>
        <span class="tag ${collLocked(c)?'':'miss'}">${collLocked(c)?'закреплено':'идёт сбор'}</span><button class="btn sm danger" data-act="coll-del" data-v="${c.id}">Удалить</button></div></div>`}).join('')}</div>`:''}`,
    foot:'<button class="btn primary" data-act="close">Готово</button>',
    bind:r=>{['cFrom','cTo','cDl'].forEach((id,i)=>r.querySelector('#'+id).onchange=e=>{nf[['from','to','deadline'][i]]=e.target.value})}};
  },true);
  ACT['coll-add']=()=>{if(!nf.from||!nf.to||!nf.deadline||nf.to<nf.from){toast('Проверьте даты периода');return}
    if(nf.deadline<TODAY){toast('Срок подачи уже прошёл — выберите дату не раньше сегодняшней');return}
    S.cfg.collect=(S.cfg.collect||[]).concat([{id:uid(),from:nf.from,to:nf.to,deadline:nf.deadline}]);markCfg();M.refresh();render();toast('Сбор дат добавлен — ассистенты увидят его у себя')};
  ACT['coll-del']=b=>{if(!armed(b,'Точно?'))return;S.cfg.collect=S.cfg.collect.filter(c=>c.id!==b.dataset.v);markCfg();M.refresh();render()};
}

/* ---------- экраны ассистента и врача ---------- */
function myShifts(field,card){
  const src=monthsSrc();const out=[];Object.keys(src).sort().forEach(ym=>Object.keys(src[ym]).sort().forEach(d=>{if(d<TODAY)return;
    forEntries(d,(en,cl,ch)=>{if(en[field]===card)out.push({d,en,cl,ch})})}));
  return out.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:SHO[x.en.shift]-SHO[y.en.shift]);
}
function shiftList(items,kind){
  if(!items.length)return`<div class="boardwrap"><div class="empty-board"><h2>Ближайших смен нет</h2><p>${kind==='assistant'?'Как только администратор поставит вас в график, смены появятся здесь.':'Когда появится график, ваши смены будут здесь.'}</p></div></div>`;
  let h='',last='';
  items.forEach(({d,en,cl,ch})=>{
    if(d!==last){if(last)h+='</div>';h+=`<div class="myday"><div class="mydate ${wdOf(d)>4?'we':''}"><b class="num">${fmt(d)}</b><span>${DAYF[wdOf(d)]}${d===TODAY?' · сегодня':''}</span></div>`;last=d}
    const tg=(en.tags||[]).map(t=>tagById(t)).filter(Boolean);
    let who='';
    if(kind==='assistant'){const av=(S.avail[en.assistantId]||{})[d];const ok=av&&(av==='day'||av===en.shift);
      who=`<div class="mym">${esc(docName(en.doctorId))}</div>${ok?'':'<div class="mywarn">Этот день у вас не отмечен как рабочий</div>'}`}
    else{const a=asById(en.assistantId);who=`<div class="mym">${a?'Ассистент: '+esc(a.name):'<span style="color:var(--bad)">Ассистент пока не назначен</span>'}</div>`}
    h+=`<div class="myshift">${shChip(en.shift)}<div style="flex:1;min-width:0"><div class="myt"><b>${esc(shiftTime(en.shift))}</b> · ${esc(cl.name)}, кресло ${ch+1}</div>${who}${tg.length?`<div class="tags" style="margin-top:4px">${tg.map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div>`:''}</div></div>`;
  });
  return`<div class="mylist">${h}</div></div>`;
}
function viewRole(){
  const role=ROLE(),card=myCard();
  const nCalls=role==='assistant'?callItems().length:0;
  const dot=activeColl().some(c=>c.to>=TODAY)?' •':'';
  const tabs=role==='assistant'?[['mine','Мои смены','Мои смены'],['avail','Когда могу'+dot,'Мои даты'+dot]].concat(nCalls?[['calls',`Свободные смены (${nCalls})`,'Свободные',nCalls]]:[]).concat([['all','Общий график','График']]):[['mine','Мои смены','Мои смены'],['all','Общий график','График']];
  if(!tabs.some(t=>t[0]===UI.rtab))UI.rtab='mine';
  $('#tabs').innerHTML=tabs.length>1?tabs.map(([k,l,sh,n])=>tabBtn('rtab',k,l,sh,UI.rtab===k,n)).join('')+moreBtn():'';
  const person=role==='assistant'?asById(card):docById(card);
  if(!person)return`<div class="login"><h1>Карточка не найдена</h1><p class="sub">Администратор открыл вам доступ, но не привязал вас к карточке ${role==='assistant'?'ассистента':'врача'}. Сообщите ему.</p><div class="row"><button class="btn" data-act="logout">Выйти</button></div></div>`;
  if(UI.rtab==='avail'){
    AV.month=AV.month||ymOf(TODAY);AV.aid=card;AV.refresh=()=>render();
    return`<div><h1>Когда могу работать</h1><p class="sub">${esc(person.name)} · выберите режим и нажимайте на дни. Всё сохраняется сразу.</p></div><div class="mycal">${availCal(card)}</div>`;
  }
  if(UI.rtab==='all')return viewBoard();
  if(UI.rtab==='calls')return viewCallsStaff(card);
  const mo=role==='assistant'?myOffers(card).filter(x=>x.st==='wait'):[];
  const moH=mo.length?`<div class="mylist myoffers"><div class="mydate"><b>Мои отклики</b><span>ждут решения ответственного</span></div>${mo.map(x=>`<div class="myoffer"><div style="flex:1;min-width:0"><div class="myt"><b class="num">${fmt(x.d)}</b> ${WD[wdOf(x.d)]} · <b>${esc(shiftTime(x.en.shift))}</b> · ${esc(x.cl.name)}, кресло ${x.ch+1}</div><div class="mym">${esc(docName(x.en.doctorId))} · <span class="st">на рассмотрении</span></div></div><button class="btn sm" data-act="pub-offer-open" data-d="${x.d}" data-e="${x.en.id}">Отменить</button></div>`).join('')}</div>`:'';
  return`<div><h1>Мои смены</h1><p class="sub">${esc(person.name)} · с сегодняшнего дня</p></div>${moH}${shiftList(myShifts(role==='assistant'?'assistantId':'doctorId',card),role)}`;
}
/* ---------- generate ---------- */
function openGen(){
  let sel=S.cfg.clinics.map(c=>c.id),over=false;
  M.show(()=>{
    const ds=range(UI.from,UI.to);
    const existing=ds.filter(d=>sel.some(c=>(dayObj(d,false)||{})[c])).length;
    const emptyTpl=S.cfg.clinics.filter(c=>sel.includes(c.id)&&!Object.keys(c.template).length);
    return{title:`<h2>Сформировать расписание</h2><p class="sub">Врачи подтянутся из базовой недели каждой клиники.</p>`,
    body:`<div class="row"><label class="f">С<input type="date" id="gFrom" value="${UI.from}"></label><label class="f">По<input type="date" id="gTo" value="${UI.to}"></label></div>
      <div><h3 style="margin:0 0 6px;font-size:12px;color:var(--muted)">Клиники</h3>${S.cfg.clinics.map(c=>`<label class="chk"><input type="checkbox" class="gcl" value="${c.id}" ${sel.includes(c.id)?'checked':''}> ${esc(c.name)} <span class="sub">· ${c.chairs} кр.</span></label>`).join('')||'<p class="sub">Сначала добавьте клинику.</p>'}</div>
      ${emptyTpl.length?`<div class="note">Пустая базовая неделя: ${emptyTpl.map(c=>esc(c.name)).join(', ')}. Для неё врачей не будет.</div>`:''}
      ${existing?`<div class="note info">На ${existing} дн. этого периода расписание уже есть.<label class="chk" style="width:100%"><input type="checkbox" id="gOver" ${over?'checked':''}> Сформировать эти дни заново (ручные правки и ассистенты в них пропадут)</label></div>`:''}`,
    foot:`<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="gen-run">Сформировать</button>`,
    bind:r=>{r.querySelectorAll('.gcl').forEach(c=>c.onchange=()=>{sel=[...r.querySelectorAll('.gcl:checked')].map(x=>x.value);M.refresh()});
      const o=r.querySelector('#gOver');if(o)o.onchange=()=>over=o.checked;
      r.querySelector('#gFrom').onchange=e=>{if(e.target.value){UI.from=e.target.value;if(UI.to<UI.from)UI.to=UI.from;saveUI();M.refresh()}};
      r.querySelector('#gTo').onchange=e=>{if(e.target.value&&e.target.value>=UI.from){UI.to=e.target.value;saveUI();M.refresh()}}}};
  },false);
  ACT['gen-run']=()=>{
    if(!sel.length){toast('Выберите хотя бы одну клинику');return}
    const ds=range(UI.from,UI.to);if(ds.length>=190){toast('Слишком длинный период — не больше полугода');return}
    let made=0,skipped=0;const yms=new Set();
    ds.forEach(d=>{const w=wdOf(d);sel.forEach(cid=>{const cl=clById(cid);const day=dayObj(d,false);
      if(day&&day[cid]&&!over){skipped++;return}
      const nd=dayObj(d,true);nd[cid]={};
      for(let ch=0;ch<cl.chairs;ch++){const t=(cl.template[ch+'-'+w]||[]).filter(e=>docById(e.doctorId));
        if(t.length)nd[cid][ch]=t.map(e=>({id:uid(),doctorId:e.doctorId,shift:e.shift,tags:[...docById(e.doctorId).tags],assistantId:null}))}
      made++;yms.add(ymOf(d))})});
    yms.forEach(markMonth);MISS.clear();M.close();

      <p class="sub" style="margin:0">Порядок подбора: приоритетный ассистент врача → совпадение навыков → у кого меньше смен в периоде${SET().rates&&SET().cheap?' → из равных — с меньшей ставкой':''}. Слоты, для которых никого не нашлось, подсветятся красным.</p>`,
    foot:`<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="auto-run" ${total?'':'disabled'}>${w.length?'Всё равно заполнить':'Заполнить'}</button>`,
    bind:r=>{r.querySelector('#aOver').onchange=e=>over=e.target.checked;r.querySelector('#aMiss').onchange=e=>allowMiss=e.target.checked}};
  });
  ACT['auto-run']=()=>{const res=autofill({overwrite:over,allowMissing:allowMiss});M.close();
    toast(`Назначено: ${res.filled}. ${res.left?`Не нашлось ассистента для ${res.left} — они подсвечены.`:'Все слоты заполнены.'}`)};

function autofill(o){
  const ds=range(UI.from,UI.to);const yms=new Set();MISS.clear();
  if(o.overwrite)ds.forEach(d=>forEntries(d,en=>{if(en.assistantId){en.assistantId=null;yms.add(ymOf(d))}}));
  const load=loadMap();let filled=0,left=0;
  ds.forEach(d=>{
    let open=[];forEntries(d,en=>{if(!en.assistantId)open.push(en)});
    while(open.length){
      const ev=open.map(en=>{const cs=classify(d,en,busyMap(d,en.id),load).filter(c=>(c.group==='prio'||c.group==='can')&&(o.allowMissing||!c.missing.length));return{en,cs}});
      ev.sort((x,y)=>x.cs.length-y.cs.length);
      const t=ev[0];
      if(!t.cs.length){
        const all=classify(d,t.en,busyMap(d,t.en.id),load);
        const near=all.filter(c=>c.group==='prio'||c.group==='can');
        MISS.set(t.en.id,near.length?'Свободны только без нужного навыка: '+near.map(c=>c.a.name).join(', '):'Нет свободных ассистентов на эту смену');
        left++;open=open.filter(e=>e!==t.en);continue;
      }
      const sc=c=>(c.group==='prio'?100:0)+c.matched*6-c.missing.length*25-c.load*3+(c.av===t.en.shift?2:0);
      const ranked=t.cs.slice().sort((x,y)=>sc(y)-sc(x)||byName(x.a,y.a));let best=ranked[0];
      if(SET().rates&&SET().cheap){const top=sc(best);const eq=ranked.filter(c=>top-sc(c)<=3&&c.group===best.group&&c.missing.length===best.missing.length);
        const pr=c=>num(c.a.rate)!=null?shiftCost(c.a,t.en.shift):Infinity;eq.sort((x,y)=>pr(x)-pr(y));if(pr(eq[0])<pr(best))best=eq[0]}
      t.en.assistantId=best.a.id;load[best.a.id]=(load[best.a.id]||0)+1;filled++;yms.add(ymOf(d));
      open=open.filter(e=>e!==t.en);
    }
  });
  yms.forEach(markMonth);pruneCalls();render();return{filled,left};
}

function placeStep(){
  const o=$('#tour');if(!o||!TOUR)return;const hole=o.querySelector('.t-hole'),tip=o.querySelector('.t-tip'),cover=o.querySelector('.t-cover');const bl=o.querySelectorAll('.t-blk');
  const el=TOUR.el&&document.body.contains(TOUR.el)?TOUR.el:null;const W=innerWidth,H=innerHeight,pad=6;const s=TOUR.steps[TOUR.i]||{};
  const setBlk=(x,y,w,h)=>{const r=[[0,0,W,y],[0,y+h,W,H-y-h],[0,y,x,h],[x+w,y,W-x-w,h]];bl.forEach((b,k)=>{const q=r[k];b.style.cssText=`left:${q[0]}px;top:${q[1]}px;width:${Math.max(0,q[2])}px;height:${Math.max(0,q[3])}px`})};
  if(!el){hole.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;setBlk(W/2,H/2,0,0);cover.style.cssText='display:none';tip.style.left=Math.max(12,(W-tip.offsetWidth)/2)+'px';tip.style.top=Math.max(12,(H-tip.offsetHeight)/2)+'px';return}
  const r=el.getBoundingClientRect();const x=Math.max(4,r.left-pad),y=Math.max(4,r.top-pad),w=Math.min(W-8,r.width+pad*2),h=Math.min(H-8,r.height+pad*2);
  hole.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;hole.classList.toggle('act',!!s.act);
  setBlk(x,y,w,h);cover.style.cssText=s.act?'display:none':`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  // подсказка не должна закрывать подсвеченное: пробуем снизу, сверху, справа, слева, иначе — место с наименьшим перекрытием
  const tw=tip.offsetWidth,th=tip.offsetHeight,m=12,cx=v=>Math.min(Math.max(m,v),W-tw-m),cy=v=>Math.min(Math.max(m,v),H-th-m);
  const cands=[[cx(x+w/2-tw/2),y+h+m],[cx(x+w/2-tw/2),y-th-m],[x+w+m,cy(y+h/2-th/2)],[x-tw-m,cy(y+h/2-th/2)],[W-tw-m,H-th-m],[m,H-th-m],[W-tw-m,m],[m,m]];
  const ov=([px,py])=>Math.max(0,Math.min(px+tw,x+w)-Math.max(px,x))*Math.max(0,Math.min(py+th,y+h)-Math.max(py,y));

async function showStep(i){

      ${err?`<p class="lgerr">${esc(err)}</p>`:''}<button class="btn primary ${busy?'busy':''}">${busy?'Сохраняю…':'Сменить пароль'}</button></form>`,
    foot:'<button class="btn" data-act="close">'+(ok?'Готово':'Отмена')+'</button>',
    bind:r=>{const f=r.querySelector('#pwForm');if(!f)return;f.onsubmit=async e=>{e.preventDefault();e.stopPropagation();if(busy)return;
      const o=r.querySelector('#pwOld').value,n=r.querySelector('#pwNew').value,n2=r.querySelector('#pwNew2').value;
      const fail=t=>{err=t;busy=false;M.refresh()};
      if(n.length<6)return fail('Новый пароль должен быть не короче 6 символов');
      if(n!==n2)return fail('Новые пароли не совпадают');
      if(n===o)return fail('Новый пароль совпадает с текущим');
      busy=true;err='';M.refresh();
      const u=await SB.auth.getUser();const email=u.data&&u.data.user&&u.data.user.email;
      if(!email)return fail('Не удалось определить аккаунт. Войдите заново.');
      const chk=await SB.auth.signInWithPassword({email,password:o});
      if(chk.error)return fail(/invalid/i.test(chk.error.message)?'Текущий пароль указан неверно':'Не удалось проверить пароль: '+chk.error.message);
      const up=await SB.auth.updateUser({password:n});
      if(up.error)return fail(/weak|short|least/i.test(up.error.message)?'Слишком простой пароль, придумайте другой':'Не удалось сменить пароль: '+up.error.message);
      busy=false;ok=true;M.refresh();toast('Пароль изменён')}}}));
  setTimeout(()=>$('#pwOld')?.focus(),30);
}
ACT_LATE.push(()=>{ACT['pw-change']=()=>{M.close();openPwChange()}});
if(ENV==='test'){const r=document.createElement('div');r.className='envtag';r.textContent='ТЕСТОВАЯ ВЕРСИЯ · отдельная база, рабочие данные не затрагиваются';document.body.appendChild(r);document.title='ТЕСТ · '+document.title}
/* ---------- перетаскивание мышью (и долгим нажатием на телефоне) ---------- */
let DRAG=null,DRAG_JUST=false,DPEND=null;
const justDragged=()=>{DRAG_JUST=true;setTimeout(()=>DRAG_JUST=false,80)};
document.addEventListener('click',e=>{if(DRAG_JUST){e.preventDefault();e.stopPropagation()}},true);
function dragInfo(el){
  if(!el||!el.closest||TOUR&&TOUR.busy)return null;
  if(UI.tab==='sched'&&editing()&&UI.mode==='board'){
    const ra=el.closest('#rail .ra[data-a]');if(ra)return{type:'as',aid:ra.dataset.a,from:null,label:asById(ra.dataset.a)?.name||''};
    const as=el.closest('.board .as[data-e]');if(as){const f=findEntry(as.dataset.d,as.dataset.e);return f&&f.en.assistantId?{type:'as',aid:f.en.assistantId,from:{d:as.dataset.d,e:as.dataset.e},label:asById(f.en.assistantId)?.name||''}:null}
    const doc=el.closest('.board .ent .doc');if(doc){const f=findEntry(doc.dataset.d,doc.dataset.e);return f?{type:'ent',d:doc.dataset.d,e:doc.dataset.e,label:docName(f.en.doctorId)+' · '+fmt(doc.dataset.d)}:null}
  }
  if(UI.tab==='sched'&&UI.mode==='week'&&isAdmin()){const te=el.closest('.tpl .tcell .e[data-i]');if(te){const c=te.closest('.tcell');return{type:'tpl',ch:+c.dataset.ch,w:+c.dataset.w,i:+te.dataset.i,label:te.textContent.trim()}}}
  return null;
}
function busyEx(date,ids){const m={};forEntries(date,(en,cl)=>{if(ids.includes(en.id)||!en.assistantId)return;(m[en.assistantId]=m[en.assistantId]||[]).push({shift:en.shift,label:cl.name+', '+docName(en.doctorId)})});return m}
function dragMarks(){
  const i=DRAG.info;
  if(i.type==='as'){
    document.querySelectorAll('.board .ent[data-e]').forEach(el=>{const d=el.dataset.d,e=el.dataset.e;const f=findEntry(d,e);if(!f)return;
      if(i.from&&i.from.e===e){el.classList.add('d-src');return}
      const ex=[e];if(i.from&&i.from.d===d)ex.push(i.from.e);
      const c=classify(d,f.en,busyEx(d,ex),{}).find(x=>x.a.id===i.aid);if(!c)return;
      el.classList.add(c.group==='never'||c.sub==='busy'?'d-bad':(c.group==='prio'||c.group==='can')&&!c.missing.length?'d-ok':'d-warn')});
    if(i.from){const r=$('#rail');if(r)r.classList.add('d-rm')}
  }
  if(i.type==='ent'){const f=findEntry(i.d,i.e);
    document.querySelectorAll('.board td.c[data-d]').forEach(td=>{const arr=cellArr(td.dataset.d,td.dataset.c,+td.dataset.ch,false).filter(x=>x.id!==i.e);
      td.classList.add(arr.some(x=>overlap(x.shift,f.en.shift))?'d-badc':'d-okc')})}
  if(i.type==='tpl'){const cl=clById(UI.clinic);const it=(cl.template[i.ch+'-'+i.w]||[])[i.i];
    document.querySelectorAll('.tpl .tcell').forEach(b=>{const ch=+b.dataset.ch,w=+b.dataset.w;const arr=(cl.template[ch+'-'+w]||[]).filter((x,k)=>!(ch===i.ch&&w===i.w&&k===i.i));
      b.closest('td').classList.add(arr.length>=2||arr.some(x=>overlap(x.shift,it.shift))?'d-badc':'d-okc')})}
}
function dragClear(){document.querySelectorAll('.d-ok,.d-warn,.d-bad,.d-src,.d-okc,.d-badc,.d-rm,.dover').forEach(el=>el.classList.remove('d-ok','d-warn','d-bad','d-src','d-okc','d-badc','d-rm','dover'))}
function dropTarget(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const i=DRAG.info;
  if(i.type==='as'){const ent=el.closest('.board .ent[data-e]');if(ent)return ent;if(i.from&&(el.closest('#rail')||!el.closest('.boardwrap')))return $('#rail')||document.body;return null}
  if(i.type==='ent')return el.closest('.board td.c[data-d]');
  if(i.type==='tpl'){const b=el.closest('.tpl .tcell');return b?b.closest('td'):null}
}
function dragStart(info,x,y){
  DRAG={info,x,y,over:null};document.body.classList.add('dragging');
  const g=document.createElement('div');g.className='dragghost';g.textContent=info.label||'';document.body.appendChild(g);DRAG.g=g;
  dragMarks();dragMove(x,y);
  DRAG.timer=setInterval(()=>autoScroll(DRAG.x,DRAG.y),30);
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}
function dragMove(x,y){if(!DRAG)return;DRAG.x=x;DRAG.y=y;DRAG.g.style.left=x+'px';DRAG.g.style.top=y+'px';
  const t=dropTarget(x,y);if(t!==DRAG.over){if(DRAG.over)DRAG.over.classList.remove('dover');DRAG.over=t;if(t&&t!==document.body)t.classList.add('dover')}}
function autoScroll(x,y){const box=document.querySelector('.scrollbox');const E=46,V=14;
  if(box){const r=box.getBoundingClientRect();if(x>r.left&&x<r.right&&y>r.top&&y<r.bottom){
    const dx=x<r.left+E?-V:x>r.right-E?V:0,dy=y<r.top+E?-V:y>r.bottom-E?V:0;if(dx||dy){box.scrollBy(dx,dy);dragMove(x,y)}}}
  if(y<40)window.scrollBy(0,-V);else if(y>innerHeight-40)window.scrollBy(0,V)}
function dragEnd(drop){if(!DRAG)return;const d=DRAG;DRAG=null;clearInterval(d.timer);d.g.remove();document.body.classList.remove('dragging');
  const t=d.over;dragClear();justDragged();if(drop&&t)doDrop(d.info,t)}
function doDrop(i,t){
  if(i.type==='as'){
    if(t.classList&&t.classList.contains('ent')){const d=t.dataset.d,e=t.dataset.e;const f=findEntry(d,e);if(!f)return;
      if(i.from&&i.from.e===e)return;
      const nm=asById(i.aid)?.name||'';
      if(i.from){const src=findEntry(i.from.d,i.from.e);const prev=f.en.assistantId;f.en.assistantId=i.aid;if(src)src.en.assistantId=prev||null;MISS.delete(e);MISS.delete(i.from.e);
        markMonth(ymOf(d));if(ymOf(i.from.d)!==ymOf(d))markMonth(ymOf(i.from.d));toast(prev?`${nm} и ${asById(prev)?.name||''} поменялись сменами`:`${nm} перенесён(а) на ${fmt(d)}, ${docName(f.en.doctorId)}`)}
      else{f.en.assistantId=i.aid;MISS.delete(e);markMonth(ymOf(d));toast(`${nm} → ${fmt(d)}, ${docName(f.en.doctorId)}`)}
      pruneCalls();render();return}
    if(i.from){const src=findEntry(i.from.d,i.from.e);if(src){src.en.assistantId=null;markMonth(ymOf(i.from.d));toast(`${asById(i.aid)?.name||'Ассистент'} снят(а) со смены ${fmt(i.from.d)}`);render()}}
    return}
  if(i.type==='ent'){const d2=t.dataset.d,c2=t.dataset.c,ch2=+t.dataset.ch;const f=findEntry(i.d,i.e);if(!f)return;
    if(d2===i.d&&c2===f.cl.id&&ch2===f.ch)return;
    const tarr=cellArr(d2,c2,ch2,true);if(tarr.some(x=>x.id!==i.e&&overlap(x.shift,f.en.shift))){toast('В этом кресле в это время уже есть врач');render();return}
    const sarr=cellArr(i.d,f.cl.id,f.ch,false);sarr.splice(sarr.indexOf(f.en),1);
    let msg=`${docName(f.en.doctorId)}: смена перенесена`;if(d2!==i.d&&f.en.assistantId){msg+=`, ассистент снят — другой день`;f.en.assistantId=null}
    tarr.push(f.en);MISS.delete(f.en.id);markMonth(ymOf(i.d));if(ymOf(d2)!==ymOf(i.d))markMonth(ymOf(d2));pruneCalls();toast(msg);render();return}
  if(i.type==='tpl'){const b=t.querySelector('.tcell');if(!b)return;const ch=+b.dataset.ch,w=+b.dataset.w;if(ch===i.ch&&w===i.w)return;
    const cl=clById(UI.clinic);const sk=i.ch+'-'+i.w,tk=ch+'-'+w;const src=cl.template[sk]||[];const it=src[i.i];if(!it)return;const tarr=cl.template[tk]||[];
    if(tarr.length>=2||tarr.some(x=>overlap(x.shift,it.shift))){toast('В этом кресле в это время уже есть врач');render();return}
    src.splice(i.i,1);if(!src.length)delete cl.template[sk];cl.template[tk]=tarr.concat([it]);markCfg();toast(`${docName(it.doctorId)} → ${WD[w]}, кресло ${ch+1}`);render()}
}
// мышь
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0||PAINT)return;const info=dragInfo(e.target);if(!info)return;DPEND={info,x:e.clientX,y:e.clientY};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;
  if(DPEND&&!DRAG){if(Math.hypot(e.clientX-DPEND.x,e.clientY-DPEND.y)>6){dragStart(DPEND.info,e.clientX,e.clientY);DPEND=null}}
  else if(DRAG){dragMove(e.clientX,e.clientY);e.preventDefault()}});
document.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;DPEND=null;if(DRAG)dragEnd(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&DRAG){dragEnd(false)}});
// палец: долгое нажатие
let TP=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1||PAINT)return;const t=e.touches[0];const info=dragInfo(e.target);if(!info)return;
  TP={x:t.clientX,y:t.clientY,info,timer:setTimeout(()=>{if(TP){dragStart(TP.info,TP.x,TP.y);TP.started=true}},380)}},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(DRAG){e.preventDefault();dragMove(t.clientX,t.clientY);return}
  if(TP&&Math.hypot(t.clientX-TP.x,t.clientY-TP.y)>10){clearTimeout(TP.timer);TP=null}},{passive:false});
document.addEventListener('touchend',e=>{if(TP){clearTimeout(TP.timer);TP=null}if(DRAG){e.preventDefault();dragEnd(true)}},{passive:false});
document.addEventListener('touchcancel',()=>{if(TP){clearTimeout(TP.timer);TP=null}if(DRAG)dragEnd(false)});
document.addEventListener('contextmenu',e=>{if(DRAG||TP)e.preventDefault()});

/* ---------- отметка дат «мазком» ---------- */
let PAINT=null;
function paintSet(el,val){el.classList.remove('day','am','pm','v-day','v-am','v-pm');
  if(el.classList.contains('dd')){if(val!=='none')el.classList.add(val);const sm=el.querySelector('small');if(sm)sm.remove();if(val!=='none'){const x=document.createElement('small');x.textContent=SH[val].s;el.appendChild(x)}}
  else{if(val!=='none')el.classList.add('v-'+val);el.textContent=val!=='none'?SH[val].s:''}}
function paintCell(el){if(!PAINT)return;const ds=el.dataset.v||el.dataset.d;const aid=PAINT.aid;if(PAINT.done.has(ds))return;
  if(PAINT.kind==='cal'&&!avEditable(ds))return;
  PAINT.done.add(ds);const prev=AV.aid;AV.aid=aid;avSet(ds,PAINT.val);AV.aid=prev;paintSet(el,PAINT.val)}
document.addEventListener('pointerdown',e=>{if(e.button>0||DRAG)return;
  const dd=e.target.closest&&e.target.closest('.cal .dd[data-act=av-day]');
  if(dd&&!dd.disabled){const ds=dd.dataset.v;if(!avEditable(ds))return;const cur=(S.avail[AV.aid]||{})[ds];
    PAINT={kind:'cal',aid:AV.aid,val:cur===AV.brush?'none':AV.brush,done:new Set()};paintCell(dd);e.preventDefault();return}
  const ac=e.target.closest&&e.target.closest('.amap td.ac[data-a]');
  if(ac&&isAdmin()&&e.pointerType!=='touch'){const aid=ac.dataset.a,ds=ac.dataset.d;const cur=(S.avail[aid]||{})[ds];
    PAINT={kind:'amap',aid,val:cur===AV.brush?'none':AV.brush,done:new Set()};paintCell(ac);e.preventDefault()}});
// на телефоне в «Доступности» — отметка касанием (чтобы прокрутка пальцем ничего не отмечала)
let LAST_PT='mouse';document.addEventListener('pointerdown',e=>{LAST_PT=e.pointerType},true);
document.addEventListener('click',e=>{if(LAST_PT!=='touch'||DRAG_JUST)return;const ac=e.target.closest&&e.target.closest('.amap td.ac[data-a]');if(!ac||!isAdmin())return;
  const aid=ac.dataset.a,ds=ac.dataset.d;const cur=(S.avail[aid]||{})[ds];const prev=AV.aid;AV.aid=aid;avSet(ds,cur===AV.brush?'none':AV.brush);AV.aid=prev;markAvail(aid);render()});
document.addEventListener('pointermove',e=>{if(!PAINT)return;const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;
  if(PAINT.kind==='cal'){const dd=el.closest('.cal .dd[data-act=av-day]');if(dd&&!dd.disabled)paintCell(dd)}
  else{const ac=el.closest('.amap td.ac[data-a]');if(ac&&ac.dataset.a===PAINT.aid)paintCell(ac)}});
const paintEnd=()=>{if(!PAINT)return;const p=PAINT;PAINT=null;if(p.done.size){markAvail(p.aid);justDragged();if(p.kind==='cal')AV.refresh();else render()}};
document.addEventListener('pointerup',paintEnd);document.addEventListener('pointercancel',paintEnd);

ACT_LATE.push(()=>{
  ACT['mcl']=b=>{const cls=S.cfg.clinics,id=b.dataset.v;
    if(id==='*'){UI.mall=!UI.mall;saveUI();render();return}
    if(UI.mall){UI.mall=false;UI.mcl=[id];saveUI();render();return}
    let sel=mSel(range(UI.from,UI.to),cls);
    if(sel.includes(id)){if(sel.length>1)sel=sel.filter(x=>x!==id)}else{if(sel.length>=3)sel.shift();sel.push(id)}
    UI.mcl=cls.map(c=>c.id).filter(x=>sel.includes(x));saveUI();render()};
  ACT['mdoc']=()=>{UI.mdoc=!UI.mdoc;saveUI();render()};
  ACT['mview']=()=>{UI.mview=UI.mview==='table'?'cards':'table';saveUI();render()};
  ACT['pub-offer-open']=b=>openOfferPub(b.dataset.d,b.dataset.e);
  ACT['pub-offer']=b=>{const card=myCard();if(!card)return;const o=S.offers[card]=S.offers[card]||{};const e=b.dataset.e;
    if(o[e])delete o[e];else o[e]=new Date().toISOString();markAvail(card);const on=!!o[e];M.close();render();toast(on?'Отклик отправлен ответственному':'Отклик отменён')};
  ['mcl','mdoc','mview','pub-offer-open','pub-offer'].forEach(k=>ROLE_OK.add(k));
});
ACT_LATE.forEach(f=>f());
render();
initStore();
